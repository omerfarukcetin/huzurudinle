  // ---------- İstatistikler ----------
  function streak() {
    let n = 0; const d = new Date();
    if (daySum(dayKey(d)) < 60) d.setDate(d.getDate() - 1); // bugün henüz dinlenmediyse seri dünden sayılır
    while (daySum(dayKey(d)) >= 60) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  // ---------- Takvim: ay ay dinleme günleri; güne dokununca ayrıntı ve silme ----------
  let calMonth = null; // YYYY-AA
  const monthShift = (m, n) => { const d = new Date(m + '-01T12:00:00'); d.setMonth(d.getMonth() + n); return dayKey(d).slice(0, 7); };
  function calendarHTML(goal) {
    const thisMonth = dayKey().slice(0, 7), today = dayKey();
    const all = listenDays().sort();
    const first = (all[0] || today).slice(0, 7);
    if (!calMonth || calMonth > thisMonth) calMonth = thisMonth;
    if (calMonth < first) calMonth = first;
    const start = new Date(calMonth + '-01T12:00:00');
    const lead = (start.getDay() + 6) % 7; // Pazartesi ilk gün
    const n = new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate();
    const g = goal * 60;
    // Renk: hedefin yarısından az, hedefe kadar, hedef, iki katı
    const level = s => !s ? 0 : s < g / 2 ? 1 : s < g ? 2 : s < g * 2 ? 3 : 4;
    let cells = '', mDays = 0, mSec = 0;
    for (let i = 0; i < lead; i++) cells += '<span class="cal-day empty"></span>';
    for (let d = 1; d <= n; d++) {
      const k = `${calMonth}-${String(d).padStart(2, '0')}`, s = k <= today ? daySum(k) : 0;
      if (s >= 1) { mDays++; mSec += s; }
      const cls = `cal-day l${level(s)}${s >= g ? ' goal' : ''}${k === today ? ' today' : ''}${k > today ? ' future' : ''}`;
      const label = `${dayName(k)}: ${s >= 1 ? dayLen(s) : 'dinleme yok'}`;
      cells += s >= 1 ? `<button type="button" class="${cls}" data-day="${k}" title="${esc(label)}" aria-label="${esc(label)}">${d}</button>` : `<span class="${cls}" title="${esc(label)}">${d}</span>`;
    }
    const sw = l => `<i class="cal-day l${l}" style="aspect-ratio:auto"></i>`;
    return `<div class="card" id="cal">
      <div class="cal-h"><h3>Takvim</h3><div class="cal-nav">
        <button type="button" data-cal="${monthShift(calMonth, -1)}" aria-label="Önceki ay" ${calMonth <= first ? 'disabled' : ''}>${ICON_CHEV_L}</button>
        <strong>${start.toLocaleDateString('tr', { month: 'long', year: 'numeric' })}</strong>
        <button type="button" data-cal="${monthShift(calMonth, 1)}" aria-label="Sonraki ay" ${calMonth >= thisMonth ? 'disabled' : ''}>${ICON_CHEV_R}</button>
      </div></div>
      <div class="cal-grid">${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map(w => `<span class="wd">${w}</span>`).join('')}${cells}</div>
      <div class="cal-foot"><span>${mDays ? `Bu ay ${mDays} gün · ${dayLen(mSec)}` : 'Bu ay dinleme yok'} · Ayrıntı ve silme için bir güne dokun</span>
        <span class="cal-legend">Az ${[1, 2, 3, 4].map(sw).join('')} Çok</span></div>
    </div>`;
  }
  function openDay(k) {
    const s = daySum(k), goal = state.goal || 15;
    const per = Object.entries(dayBooks(k)).map(([bk, sec]) => ({ b: bookByKey(bk), sec })).filter(x => x.b && x.sec >= 1).sort((x, y) => y.sec - x.sec);
    const known = per.reduce((n, x) => n + x.sec, 0);
    openPop(`<div class="pop-h"><h4>${esc(dayName(k))}</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <p class="note" style="margin:0 0 6px"><b>${dayLen(s)}</b> dinlendi · ${s >= goal * 60 ? 'günlük hedef tutturuldu' : `günlük hedef ${goal} dk`}</p>
      ${per.length ? `<div class="day-books">${per.map(x => `<div><img alt="" src="${esc(x.b.cover)}"><span>${esc(x.b.title)}</span><b>${dayLen(x.sec)}</b></div>`).join('')}</div>` : ''}
      ${s - known >= 60 ? `<p class="note" style="margin:8px 0 0">${per.length ? `${dayLen(s - known)} için` : 'Bu gün için'} kitap ayrıntısı yok (takvimden önceki kayıt).</p>` : ''}
      <div class="btn-grid"><button class="btn2" type="button" data-close>Kapat</button><button class="btn2 danger" type="button" id="dayDel">Bu günün kaydını sil</button></div>`, {
      dark: false,
      onMount(card) {
        card.querySelector('#dayDel').onclick = () => confirmPop('Bu günün kaydını sil', `<b>${esc(dayName(k))}</b> dinlenen ${dayLen(s)} silinecek. Günlük hedef, seri, toplam süre ve o günü kapsayan dinleyişlerin süresi buna göre düzelir. Bölümlerde kaldığın yer değişmez; gerekirse çalarda konumu geri sürükleyebilirsin.`, 'Sil', () => {
          deleteDay(k); toast(`${dayName(k)}: kayıt silindi`); renderStats();
        });
      }
    });
  }

  function renderStats() {
    const goal = state.goal || 15;
    const today = daySum(dayKey());
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return { d, k: dayKey(d), s: daySum(dayKey(d)) }; });
    const week = days.reduce((n, x) => n + x.s, 0);
    const allDays = new Set(listenDays());
    const total = [...allDays].reduce((n, k) => n + daySum(k), 0);
    const st = streak();
    const mins = s => Math.round(s / 60);
    const dur = s => s < 1 ? '' : s < 60 ? `${Math.round(s)} sn` : human(s);
    const max = Math.max(goal * 60, ...days.map(x => x.s));
    const started = books.filter(b => bookPct(b) > 0.2).sort((a, b) => bookPct(b) - bookPct(a));
    const rem = reminder();
    // En çok tekrar dinlenenler başta
    const finished = books.filter(b => countsRounds(b) && finishCount(b)).sort((x, y) => finishCount(y) - finishCount(x) || pastRounds(y).at(-1).end - pastRounds(x).at(-1).end);
    const finBooks = finished.filter(b => b.key !== TEFSIR_KEY), tefsir = bookByKey(TEFSIR_KEY);

    $('statsBody').innerHTML = `
      <h2 class="pt">Dinleme özetin</h2>
      <div class="kpis">
        <div class="kpi"><small>Bugün</small><strong>${dur(today) || '0 dk'}</strong><div class="sub">Hedef ${goal} dk${today >= goal * 60 ? ' · tamamlandı' : ''}</div><div class="gbar"><i style="width:${Math.min(100, today / (goal * 60) * 100).toFixed(1)}%"></i></div></div>
        <div class="kpi"><small>Son 7 gün</small><strong>${dur(week) || '0 dk'}</strong><div class="sub">Günde ortalama ${mins(week / 7)} dk</div></div>
        <div class="kpi"><small>Seri</small><strong>${st} gün</strong><div class="sub">${st ? 'Her gün en az 1 dk dinledin' : 'Bugün dinleyerek başla'}</div></div>
        <div class="kpi"><small>Toplam</small><strong>${dur(total) || '0 dk'}</strong><div class="sub">${allDays.size} günde</div></div>
      </div>
      <div class="stats-cols">
        <div class="card">
          <h3>Son 7 gün</h3>
          <div class="plot">
            <div class="goal-line" style="bottom:${(goal * 60 / max * 82).toFixed(1)}%"><span>Hedef ${goal} dk</span></div>
            <div class="bars">${days.map((x, i) => `<div class="bw${i === 6 ? ' today' : ''}" title="${x.d.toLocaleDateString('tr', { weekday: 'long', day: 'numeric', month: 'long' })}: ${dur(x.s) || '0 dk'}"><span class="v">${x.s >= 60 ? mins(x.s) + ' dk' : ''}</span><div class="b" style="height:${(x.s / max * 82).toFixed(1)}%"></div></div>`).join('')}</div>
          </div>
          <div class="blabels">${days.map((x, i) => `<span class="${i === 6 ? 'today' : ''}">${i === 6 ? 'Bugün' : x.d.toLocaleDateString('tr', { weekday: 'short' })}</span>`).join('')}</div>
        </div>
        <div class="card">
          <h3>Günlük hedef ve hatırlatma</h3>
          <div class="setrow" style="border:0;padding-top:0"><span>Günlük hedef</span></div>
          <div class="pills" id="goalPills">${[5, 10, 15, 20, 30, 45, 60].map(v => `<button class="pill" type="button" data-goal="${v}" aria-pressed="${v === goal}">${v} dk</button>`).join('')}</div>
          <div class="setrow" style="margin-top:12px"><span>Günlük hatırlatma<p class="status" id="remStatus">${esc(reminderStatus)}</p></span><label class="sw"><input type="checkbox" id="remOn" ${rem.on ? 'checked' : ''} aria-label="Günlük hatırlatma"><span></span></label></div>
          <div class="setrow"><span>Hatırlatma saati</span><select id="remHour" aria-label="Hatırlatma saati">${Array.from({ length: 17 }, (_, i) => i + 6).map(h => `<option value="${h}" ${h === rem.hour ? 'selected' : ''}>${String(h).padStart(2, '0')}:00</option>`).join('')}</select></div>
          <p class="status">O saate kadar hedefini doldurmadıysan bildirim gelir.</p>
        </div>
      </div>
      ${calendarHTML(goal)}
      ${finished.length ? `<div class="card">
        <h3>Bitirdiklerin</h3>
        <p class="status" style="margin:0 0 6px">${finBooks.length ? `${finBooks.length} kitabı toplam ${finBooks.reduce((n, b) => n + finishCount(b), 0)} kez bitirdin.` : ''}${tefsir && finishCount(tefsir) ? ` Kur'an-ı Kerim Tefsiri: ${finishCount(tefsir)} hatim.` : ''}</p>
        ${finished.map(b => { const p = pastRounds(b), last = p[p.length - 1]; return `<button class="bprog" type="button" data-book="${b.id}"><img alt="" src="${esc(b.cover)}"><span style="min-width:0"><strong>${esc(b.title)}</strong><small>Son bitiriş ${dateMs(last.end)}${roundRec(b)?.cur ? ` · şu an ${roundNo(b)}. ${roundWord(b)}` : ''}</small></span><span class="pc">×${p.length}</span></button>`; }).join('')}
      </div>` : ''}
      <div class="card">
        <h3>Kitaplar</h3>
        ${started.length ? started.map(b => {
          const pct = bookPct(b), left = Math.max(0, b.total - listened(b));
          return `<button class="bprog" type="button" data-book="${b.id}"><img alt="" src="${esc(b.cover)}"><span style="min-width:0"><strong>${esc(b.title)}</strong><div class="pb"><i style="width:${pct.toFixed(1)}%"></i></div><small>${doneCount(b)} / ${b.tracks.length} bölüm dinlendi${left ? ` · ${human(left)} kaldı` : ''}</small></span><span class="pc">%${pct < 1 ? pct.toFixed(1).replace('.', ',') : Math.floor(pct)}</span></button>`;
        }).join('') : '<p class="empty-card">Henüz bir kitaba başlamadın. Dinlediğin kitaplar ve ilerlemen burada görünür.</p>'}
      </div>
      <p class="foot">${user ? 'Süreler giriş yaptığın tüm cihazlardan toplanır.' : 'Süreler bu cihazda tutuluyor. Giriş yaparsan tüm cihazların birlikte sayılır.'}
        <br><a class="linkbtn" href="#verilerim">Verilerimi yönet ve sil</a></p>`;

    $('statsBody').querySelectorAll('[data-book]').forEach(x => x.onclick = () => go(`#kitap-${x.dataset.book}`));
    $('statsBody').querySelectorAll('[data-cal]').forEach(x => x.onclick = () => { calMonth = x.dataset.cal; renderStats(); });
    $('statsBody').querySelectorAll('[data-day]').forEach(x => x.onclick = () => openDay(x.dataset.day));
    $('statsBody').querySelectorAll('[data-goal]').forEach(x => x.onclick = () => { state.goal = +x.dataset.goal; persist(true); reminderSync(); renderStats(); });
    $('remOn').onchange = e => setReminder(e.target.checked);
    $('remHour').onchange = e => { saveReminder({ ...reminder(), hour: +e.target.value }); reminderSync(); };
  }

  // ---------- Verilerim: kullanıcının kendi kayıtlarını görüp silmesi ----------
  function confirmPop(title, text, okLabel, onOk) {
    openPop(`<div class="pop-h"><h4>${esc(title)}</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <p class="note" style="margin:0">${text}</p>
      <div class="btn-grid"><button class="btn2" type="button" data-close>Vazgeç</button><button class="btn2 danger" type="button" id="okBtn">${esc(okLabel)}</button></div>`, {
      dark: false,
      onMount(card) { card.querySelector('#okBtn').onclick = async e => { e.target.disabled = true; try { await onOk(); } finally { closePop(); } }; }
    });
  }
  function stopIfIn(keys) {
    // Silinen kayıt şu an çalıyorsa ya da mini çalarda bekliyorsa onu da kaldır
    const k = cur ? books[cur.b].tracks[cur.t].key : state.last;
    if (!keys || (k && keys.has(k))) {
      audio.pause(); audio.removeAttribute('src'); cur = null; shared = null;
      $('bar').hidden = true; document.body.classList.remove('has-mini');
    }
  }
  function resetBook(bi) {
    const b = books[bi], now = Date.now(), keys = new Set(b.tracks.map(t => t.key));
    // Silindi işareti: diğer cihazlarda daha eski konum olsa bile bu kazanır
    b.tracks.forEach(t => { if (state.progress[t.key]) state.progress[t.key] = { pos: 0, dur: state.progress[t.key].dur || t.dur || 0, done: false, at: now }; });
    delete state.lastByBook[b.key];
    if (state.plans[b.key]) state.plans[b.key] = { deleted: true, at: now };
    // Süren dinleyiş baştan başlar; bitmiş dinleyişlerin geçmişi kalır
    const rr = roundRec(b); if (rr?.cur) { rr.cur = { n: rr.cur.n, start: now, sec: {} }; rr.at = now; }
    state.recent = state.recent.filter(k => k !== b.key);
    if (state.last && keys.has(state.last)) { stopIfIn(keys); state.last = null; }
    saveNow();
    toast(`${b.title}: ilerleme silindi`);
  }
  function deleteBookmark(id) {
    state.bookmarks[id] = { ...state.bookmarks[id], deleted: true, note: undefined, at: Date.now() };
    saveNow();
  }
  function deleteAllBookmarks() { state.epoch.bookmarks = Date.now(); state.bookmarks = {}; saveNow(); toast('Tüm yer imleri silindi'); }
  function clearHistory() { state.epoch.daily = Date.now(); state.daily = {}; state.dayBooks = {}; state.dayContent = {}; saveNow(); toast('Dinleme geçmişi silindi'); }
  function clearAll() {
    const now = Date.now();
    stopIfIn(null);
    state.epoch = { progress: now, bookmarks: now, daily: now, plans: now, rounds: now };
    Object.assign(state, { progress: {}, bookmarks: {}, daily: {}, dayBooks: {}, dayContent: {}, plans: {}, rounds: {}, last: null, lastByBook: {}, recent: [] });
    saveNow();
    toast('Tüm dinleme verilerin silindi');
  }

  function renderData() {
    const started = books.filter(b => b.tracks.some(t => { const p = prog(t); return p && (p.done || p.pos > 1); }) || lastInBook(b.id) != null);
    const marks = Object.entries(state.bookmarks).filter(([, m]) => !m.deleted && byKey.get(m.k))
      .map(([id, m]) => ({ id, ...m, ...byKey.get(m.k) })).sort((x, y) => y.at - x.at);
    const days = new Set(listenDays());
    const total = [...days].reduce((n, k) => n + daySum(k), 0);
    const plans = books.filter(b => activePlan(b));
    const rounded = books.filter(b => countsRounds(b) && finishCount(b));
    const nothing = !started.length && !marks.length && !days.size && !plans.length && !rounded.length;

    $('dataBody').innerHTML = `
      <h2 class="pt">Verilerim</h2>
      <p class="note" style="margin:4px 0 0;max-width:640px">Burada ${user ? 'hesabında ve bu cihazda' : 'bu cihazda'} saklanan dinleme kayıtlarını görebilir ve silebilirsin.${user ? ' Sildiğin kayıt, giriş yaptığın diğer cihazlardan da silinir.' : ''} Kitaplar ve sesler etkilenmez.</p>

      <div class="card">
        <h3>Kitaplardaki ilerleme <small class="count">${started.length} kitap</small></h3>
        ${started.length ? started.map(b => `<div class="drow"><img alt="" src="${esc(b.cover)}"><span style="min-width:0"><strong>${esc(b.title)}</strong><small>${doneCount(b)} / ${b.tracks.length} bölüm dinlendi · %${Math.floor(bookPct(b))}${lastInBook(b.id) != null ? ` · kaldığın yer: Bölüm ${b.tracks[lastInBook(b.id)].no}` : ''}</small></span><button class="dbtn" type="button" data-reset="${b.id}">Sıfırla</button></div>`).join('')
          : '<p class="empty-card">Henüz bir kitapta ilerleme yok.</p>'}
      </div>

      <div class="card">
        <h3>Yer imleri <small class="count">${marks.length}</small></h3>
        ${marks.length ? marks.map(m => { const b = books[m.b], t = b.tracks[m.t]; return `<div class="drow"><img alt="" src="${esc(b.cover)}"><span style="min-width:0"><strong>${m.note ? esc(m.note) : esc(t.name)}</strong><small>${esc(b.title)} · ${m.note ? esc(t.name) + ' · ' : ''}${fmt(m.pos)}${m.r && (m.r > 1 || finishCount(b)) ? ` · ${m.r}. ${roundWord(b)}` : ''}</small></span><button class="dbtn icon" type="button" data-delmark="${m.id}" aria-label="Yer imini sil">${ICON_X}</button></div>`; }).join('')
          + `<div class="drow end"><button class="dbtn" type="button" id="delMarks">Tüm yer imlerini sil</button></div>`
          : '<p class="empty-card">Kayıtlı yer imi yok.</p>'}
      </div>

      <div class="card">
        <h3>Okuma planları <small class="count">${plans.length}</small></h3>
        ${plans.length ? plans.map(b => { const p = activePlan(b); return `<div class="drow"><img alt="" src="${esc(b.cover)}"><span style="min-width:0"><strong>${esc(b.title)}</strong><small>${dateWords(p.start)} – ${dateWords(p.end)} · ${dayDiff(p.start, p.end) + 1} gün</small></span><button class="dbtn icon" type="button" data-delplan="${b.id}" aria-label="Planı kaldır">${ICON_X}</button></div>`; }).join('')
          : '<p class="empty-card">Okuma planı yok. Kitap sayfasından plan oluşturabilirsin.</p>'}
      </div>

      <div class="card">
        <h3>Bitirilen dinleyişler <small class="count">${rounded.length} kitap</small></h3>
        ${rounded.length ? rounded.map(b => `<div class="drow"><img alt="" src="${esc(b.cover)}"><span style="min-width:0"><strong>${esc(b.title)}</strong><small>${finishCount(b)} ${b.key === TEFSIR_KEY ? 'hatim' : 'kez bitirildi'} · son ${dateMs(pastRounds(b).at(-1).end)}</small></span><button class="dbtn" type="button" data-delrounds="${b.id}">Sil</button></div>`).join('')
          : '<p class="empty-card">Henüz bitirilmiş kitap yok. Bir kitabı bitirdiğinde her dinleyiş burada ayrı sayılır.</p>'}
      </div>

      <div class="card">
        <h3>Dinleme geçmişi</h3>
        ${days.size ? `<div class="drow"><span style="min-width:0;grid-column:1/3"><strong>${days.size} günlük kayıt · toplam ${human(total) || Math.round(total) + ' sn'}</strong><small>İstatistiklerdeki günlük süreler ve seri bu kayıttan hesaplanır.</small></span><button class="dbtn" type="button" id="delHistory">Geçmişi sil</button></div>
          <div class="drow end" style="justify-content:flex-start;align-items:center;gap:10px;flex-wrap:wrap"><button class="linkbtn" type="button" id="toCal">Takvimde gün seç ve sil</button><small style="color:var(--muted)">Yanlışlıkla dinlediğin bir günü tek başına silebilirsin.</small></div>`
          : '<p class="empty-card">Dinleme geçmişi yok.</p>'}
      </div>

      <div class="card danger-zone">
        <h3>Tümünü sil</h3>
        <p class="hint">İlerleme, kaldığın yer, yer imleri, okuma planları, bitirilen dinleyişler ve dinleme geçmişi silinir. Tema, hız ve hedef ayarların kalır.</p>
        <button class="dbtn solid" type="button" id="delAll" ${nothing ? 'disabled' : ''}>Tüm dinleme verilerimi sil</button>
      </div>

      ${user ? `<div class="card danger-zone">
        <h3>Hesap</h3>
        <p class="hint">${esc(user.email || '')} hesabı ve hesapta saklanan bütün kayıtlar kalıcı olarak silinir. Bu işlem geri alınamaz.</p>
        <button class="dbtn solid" type="button" id="delAccount">Hesabımı sil</button>
      </div>` : ''}`;

    const body = $('dataBody');
    body.querySelectorAll('[data-reset]').forEach(x => x.onclick = () => {
      const b = books[+x.dataset.reset];
      confirmPop('İlerlemeyi sıfırla', `<b>${esc(b.title)}</b> kitabındaki dinlenen bölümler ve kaldığın yer silinecek. Yer imlerin kalır.`, 'Sıfırla', () => { resetBook(b.id); renderData(); });
    });
    body.querySelector('#toCal')?.addEventListener('click', () => { calMonth = dayKey().slice(0, 7); go('#istatistik'); setTimeout(() => $('cal')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 80); });
    body.querySelectorAll('[data-delrounds]').forEach(x => x.onclick = () => {
      const b = books[+x.dataset.delrounds];
      confirmPop('Dinleyiş geçmişini sil', `<b>${esc(b.title)}</b> için ${finishCount(b)} bitmiş ${roundWord(b)} kaydı silinecek. Kitaptaki bölüm işaretlerin ve kaldığın yer kalır.`, 'Sil', () => {
        const r = roundRec(b), now = Date.now();
        for (const n of Object.keys(r.hist)) r.hist[n] = { deleted: true, at: now };
        // Süren dinleyiş varsa 1. sayılır; kitap tamamen dinlenmiş görünüyorsa 1 kez bitmiş sayılmaya devam eder
        const ats = progAts(b);
        r.cur = r.cur ? { ...r.cur, n: 1 } : { n: 1, start: ats.length ? Math.min(...ats) : now, sec: {}, partial: true }; r.at = now;
        saveNow(); checkRounds(); toast('Dinleyiş geçmişi silindi'); renderData();
      });
    });
    body.querySelectorAll('[data-delplan]').forEach(x => x.onclick = () => { const b = books[+x.dataset.delplan]; state.plans[b.key] = { deleted: true, at: Date.now() }; saveNow(); toast('Plan kaldırıldı'); renderData(); });
    body.querySelectorAll('[data-delmark]').forEach(x => x.onclick = () => { deleteBookmark(x.dataset.delmark); toast('Yer imi silindi'); renderData(); });
    body.querySelector('#delMarks')?.addEventListener('click', () => confirmPop('Tüm yer imlerini sil', `${marks.length} yer imi ve notları silinecek.`, 'Sil', () => { deleteAllBookmarks(); renderData(); }));
    body.querySelector('#delHistory')?.addEventListener('click', () => confirmPop('Dinleme geçmişini sil', 'Günlük dinleme süreleri silinecek; istatistikler ve seri sıfırlanır. Kitaplardaki ilerlemen kalır.', 'Sil', () => { clearHistory(); renderData(); }));
    body.querySelector('#delAll')?.addEventListener('click', () => confirmPop('Tüm dinleme verilerini sil', 'İlerleme, kaldığın yer, yer imleri ve dinleme geçmişi silinecek. Bu işlem geri alınamaz.', 'Hepsini sil', () => { clearAll(); renderData(); }));
    body.querySelector('#delAccount')?.addEventListener('click', () => confirmPop('Hesabını sil', `<b>${esc(user.email || '')}</b> hesabı ve hesapta saklanan tüm kayıtlar kalıcı olarak silinecek. Bu cihazdaki kayıtlar da temizlenir.`, 'Hesabımı sil', async () => {
      try { await window.skrSync.deleteAccount(); toast('Hesabın silindi'); go(''); }
      catch (e) { toast(window.skrSync.errorText(e)); }
    }));
  }

  // ---------- Günlük hatırlatma ----------
  // Ayar bu cihazda tutulur; service worker'ın okuyabilmesi için IndexedDB'ye de yazılır.
  const reminder = () => store.get('reminder', { on: false, hour: 20 });
  const saveReminder = r => store.set('reminder', r);
  let reminderStatus = '';
  const kvOpen = () => new Promise((res, rej) => { const r = indexedDB.open('skr', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function kvMerge(k, patch) {
    try {
      const db = await kvOpen();
      const old = await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || {}); q.onerror = () => res({}); });
      await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put({ ...old, ...patch }, k); tx.oncomplete = res; tx.onerror = res; });
    } catch { /* gizli sekme vb.: hatırlatma yalnızca sayfa açıkken çalışır */ }
  }
  let lastKv = 0;
  function reminderSync(force) {
    if (!force && Date.now() - lastKv < 30000) return;
    lastKv = Date.now();
    const r = reminder();
    kvMerge('reminder', { on: r.on, hour: r.hour, goal: state.goal || 15, day: dayKey(), sec: daySum(dayKey()) });
  }
  function setStatus(t) { reminderStatus = t; const el = document.querySelector('#remStatus'); if (el) el.textContent = t; }
  async function setReminder(on) {
    const r = reminder();
    if (!on) { saveReminder({ ...r, on: false }); setStatus('Kapalı'); reminderSync(true); return; }
    if (!('Notification' in window)) { setStatus('Bu tarayıcı bildirim göstermiyor.'); $('remOn').checked = false; return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { setStatus('Bildirim izni verilmedi. Tarayıcı ayarlarından bu siteye bildirim izni verebilirsin.'); $('remOn').checked = false; return; }
    saveReminder({ ...r, on: true });
    reminderSync(true);
    let bg = false;
    try {
      const reg = await navigator.serviceWorker?.ready;
      if (reg && 'periodicSync' in reg) {
        const p = await navigator.permissions.query({ name: 'periodic-background-sync' }).catch(() => ({ state: 'denied' }));
        if (p.state === 'granted') { await reg.periodicSync.register('skr-reminder', { minInterval: 60 * 60 * 1000 }); bg = true; }
      }
    } catch { }
    setStatus(bg ? 'Açık · uygulama kapalıyken de hatırlatılır' : 'Açık · bu cihazda yalnızca site/uygulama açıkken hatırlatılır (arka plan desteği yok)');
  }
  // Sayfa açıkken de kontrol et (arka plan desteği olmayan cihazlar için)
  async function checkReminderNow() {
    const r = reminder();
    if (!r.on || !('Notification' in window) || Notification.permission !== 'granted') return;
    reminderSync(true);
    const reg = await navigator.serviceWorker?.ready.catch(() => null);
    reg?.active?.postMessage('check-reminder');
  }

  // ---------- Uygulamayı yükle (PWA) ----------
  let installEvt = null;

    if (isIOS) {

  // ---------- Sesli Yayınlar: her seri ayrı sekmede ----------

          <div class="series-acts"><button class="btn-plan" type="button" id="seriesPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>${r != null ? `Devam et · Bölüm ${b.tracks[r].no}` : 'Dinlemeye başla'}</button><a href="#kitap-${b.id}">Okuma planı ve ayrıntılar</a></div>

        <label class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg><input id="seriesSearch" type="search" placeholder="Bu seride ara" aria-label="Bu seride ara" autocomplete="off"></label>

    host.querySelector('#seriesPlay').onclick = () => { if (isFinished(b) && !justBrowsing.has(b.key)) return askNewRound(b, 0); if (cur && cur.b === b.id && cur.t === r) toggle(); else play(b.id, r ?? 0); };
    const list = host.querySelector('.list');

      const q = norm(audioQuery).split(/\s+/).filter(Boolean);
      const frag = document.createDocumentFragment();

        frag.appendChild(trackRow(b, t, j));
      });

      list.appendChild(frag);
      if (!list.children.length) list.innerHTML = '<li class="empty">Bu aramayla eşleşen bölüm yok.</li>';
    };
    const search = host.querySelector('#seriesSearch');
    if (search) {
      search.value = audioQuery;
      search.oninput = () => { audioQuery = search.value; paint(); };
      if (hadFocus) search.focus();
    }
    const groupSel = host.querySelector('#seriesGroup');
    if (groupSel) groupSel.onchange = () => { audioGroup[b.key] = groupSel.value; audioQuery = ''; if (search) search.value = ''; paint(); };
    paint();
  }

  $$('[data-has-series]').forEach(x => x.hidden = !seriesBooks.length);
  $('mainTabs').hidden = !seriesBooks.length;

  // ---------- Okuma planı ve bitiş tahmini ----------
  // Tüm süreler "içerik saniyesi"dir (1× hızda). Dinlerken geçen gerçek süre = içerik / hız.
  const dayDiff = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5);
  const addDays = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d); };
  const dateWords = k => new Date(k + 'T12:00:00').toLocaleDateString('tr', { day: 'numeric', month: 'long' });
  const atSpeed = s => s / (speed || 1); // içerik süresini seçili hızda geçen süreye çevir
  const remainingOf = b => Math.max(0, b.total - listened(b));
  const activePlan = b => { const p = state.plans[b.key]; return p && !p.deleted && p.start ? p : null; };

  // Son 14 günde (ya da dinlemeye başladığından beri) günde ortalama ne kadar içerik dinlendiği
  function pace() {
    const days = listenDays().sort();
    if (!days.length) return 0;
    const n = Math.min(14, dayDiff(days[0], dayKey()) + 1);
    let wall = 0;
    for (let i = 0; i < n; i++) wall += daySum(addDays(dayKey(), -i));
    if (wall < 10 * 60) return 0; // birkaç saniyelik dinlemeden anlamlı bir tempo çıkmaz
    return wall / n * (speed || 1);
  }

  function planInfo(b) {
    const p = activePlan(b); if (!p) return null;
    const today = dayKey(), L = listened(b), rem = remainingOf(b);
    // "Bugün dinlenen": hesaptaki gün gün içerik süresinden (tüm cihazların toplamı)
    const content = dayMap(state.dayContent, today)[b.key] || 0;
    // Geçiş: bu kayıt başlamadan önceki günlerde (güncellemenin yüklendiği gün) eski yöntem de hesaba katılır:
    // cihazın o gün siteyi ilk açtığı andaki konum
    const tracked = Object.values(state.dayContent || {}).some(dev => Object.keys(dev).some(k => k.slice(0, 10) < today));
    if (!p.snap || p.snap.day !== today) { p.snap = { day: today, listened: L }; store.set('state', state); }
    const doneToday = Math.min(L, tracked ? content : Math.max(content, L - p.snap.listened));
    const dayStartL = L - doneToday;                         // gün başında dinlenmiş içerik
    const totalDays = dayDiff(p.start, p.end) + 1;
    const dayNo = Math.min(totalDays, Math.max(1, dayDiff(p.start, today) + 1));
    const overdue = dayDiff(today, p.end) < 0;
    const daysLeft = overdue ? 1 : dayDiff(today, p.end) + 1;
    const remAtDayStart = Math.max(0, b.total - dayStartL);
    const target = remAtDayStart / daysLeft;                 // bugünün hedefi (geride kalınca kendiliğinden büyür)
    const todayLeft = Math.max(0, target - doneToday);
    // Plana göre bugün başında nerede olunmalıydı
    const expected = p.base + (b.total - p.base) * Math.min(1, (dayNo - 1) / totalDays);
    // + geride, − önde (içerik saniyesi). Gün başında olunması gereken yerle şu anki konum karşılaştırılır:
    // bugün dinledikçe anında azalır (gün başındaki konumla karşılaştırınca gün bitene kadar değişmiyordu)
    const behind = expected - L;
    const finished = rem < 60;
    let status, tone;
    if (finished) { status = 'Kitap bitti, tebrikler!'; tone = 'good'; }
    else if (overdue) { status = `Plan süresi doldu (bitiş ${dateWords(p.end)}); ${human(rem)} kaldı`; tone = 'warn'; }
    else if (todayLeft < 30) { status = 'Bugünün hedefi tamam'; tone = 'good'; }
    else if (behind > 10 * 60) { status = `Plana göre ${human(atSpeed(behind))} geridesin`; tone = 'warn'; }
    else if (behind < -10 * 60) { status = `Plandan ${human(atSpeed(-behind))} öndesin`; tone = 'good'; }
    else { status = 'Plana uygun gidiyorsun'; tone = 'ok'; }
    return { p, totalDays, dayNo, daysLeft, overdue, target, doneToday, todayLeft, behind, finished, rem, status, tone, L, expected };
  }

  // Bugün dinlenecek bölümler: kaldığın yerden başlayıp bugünün kalan hedefi dolana kadar
  function todaysTracks(b, need) {
    const out = [];
    if (need < 30) return out;
    let start = lastInBook(b.id) ?? 0;
    if (prog(b.tracks[start])?.done) start = b.tracks.findIndex((t, j) => j > start && !prog(t)?.done);
    if (start < 0) start = b.tracks.findIndex(t => !prog(t)?.done);
    if (start < 0) return out;
    let sum = 0;
    for (let j = start; j < b.tracks.length && sum < need; j++) {
      const t = b.tracks[j], p = prog(t);
      if (p?.done) continue;
      const left = Math.max(0, (t.dur || p?.dur || 0) - (p?.pos || 0));
      if (left <= 0) continue;
      const part = Math.min(left, need - sum);
      out.push({ t: j, left, part, partial: part < left - 30 });
      sum += part;
    }
    return out;
  }

  function finishEstimate(b) {
    const rem = remainingOf(b);
    if (rem < 60) return null;
    const pl = planInfo(b);
    const v = pace();
    if (!v) return { text: pl ? `Plana göre bitiş: ${dateWords(pl.p.end)}.` : 'Bitiş tahmini için birkaç gün dinlemen yeterli.' };
    const days = Math.ceil(rem / v);
    if (days > 365) return { text: `Günde ortalama ${human(atSpeed(v))} dinlediğine göre bu kitabın bitmesi bir yıldan uzun sürer.` };
    const when = addDays(dayKey(), days - 1);
    let text = `Günde ortalama ${human(atSpeed(v)) || '1 dk'} dinlediğine göre yaklaşık ${days} günde biter (${dateWords(when)}).`;
    if (pl && !pl.overdue) {
      const diff = dayDiff(pl.p.end, when);
      text += diff > 0 ? ` Bu tempoyla plandan ${diff} gün geç.` : diff < 0 ? ` Bu tempoyla plandan ${-diff} gün erken.` : ' Planla aynı gün.';
    }
    return { text };
  }

  function renderPlanCard(b) {
    const host = $('dPlan');

    const estLine = est ? `<p class="plan-est"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7z"/></svg><span>${esc(est.text)}</span></p>` : '';
    if (!pl) {
      host.innerHTML = remainingOf(b) < 60 || isFinished(b) ? '' : `${estLine}<button class="plan-start" type="button" id="planNew"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14zM7 12h5v5H7z"/></svg><span><b>Okuma planı oluştur</b>Kaç günde bitirmek istediğini seç; her gün ne dinleyeceğini hazırlayalım.</span></button>`;
      host.querySelector('#planNew')?.addEventListener('click', () => openPlanSetup(b));

    const tracks = todaysTracks(b, pl.todayLeft);
