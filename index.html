<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitap Rafı">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Hakikat Kitabevi kitaplarını sesli dinleyin; kaldığınız yerden devam edin.">
<title>Sesli Kitap Rafı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Seçilen temayı sayfa çizilmeden uygula (açılışta yanıp sönmesin). "system" = cihazın ayarı
  try { const t = JSON.parse(localStorage.getItem('skr:theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: telefonda tek sütun + yüzen mini çalar + tam ekran çalar;
   bilgisayarda (≥1024px) sol menü + geniş içerik + altta tam genişlik çalar çubuğu, kitap ve çalar sayfaları iki sütun */
:root {
  --bg: #fbfbfa;
  --surface: #ffffff;
  --surface-2: #f0f2f1;
  --fg: #141917;
  --muted: #687370;
  --line: #e4e8e6;
  --accent: #0f5c48;
  --accent-fg: #ffffff;
  --accent-soft: #e1efea;
  --danger: #c2412d;
  --warn-soft: #fbefd9;
  --warn-fg: #8a5500;
  --tile-mix: 26%;
  --shadow: 0 1px 2px rgba(20, 30, 26, .05), 0 10px 30px rgba(20, 30, 26, .10);
  /* Çalar ve paneller: temaya uyar (açık temada açık, kapak rengiyle hafif tonlu) */
  --pl-base: #f3f5f4;
  --pl-fg: #141917;
  --pl-muted: rgba(20, 25, 23, .62);
  --pl-track: rgba(20, 25, 23, .14);
  --pl-accent: #0f6f5e;
  --pl-panel: #ffffff;
  --pl-hover: rgba(20, 25, 23, .06);
  --pl-chip: rgba(20, 25, 23, .06);
  --pl-chip-hover: rgba(20, 25, 23, .11);
  --pl-chip-on-bg: #141917;
  --pl-chip-on-fg: #ffffff;
  --pl-play-bg: #141917;
  --pl-play-fg: #ffffff;
  --pl-thumb: #141917;
  --pl-line: rgba(20, 25, 23, .1);
  --pl-err: #b3361f;
  --pl-mini-mix: 18%;   /* mini çalarda kapak rengi oranı */
  --pl-tint: 26%;       /* tam ekran çalarda kapak rengi oranı */
  --pl-tint-top: 40%;
  --pl-end: #fbfbfa;

  /* Tek yazı tipi, tek ölçek */
  --font: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fs-xs: .75rem;     /* 12 — etiket, süre */
  --fs-sm: .875rem;    /* 14 — ikincil metin */
  --fs-base: 1rem;     /* 16 — gövde */
  --fs-lg: 1.125rem;   /* 18 — kart başlığı, panel başlığı */
  --fs-xl: 1.375rem;   /* 22 — raf başlığı */
  --fs-2xl: 1.75rem;   /* 28 — sayfa başlığı (telefon) */
  --fs-3xl: 2.25rem;   /* 36 — sayfa başlığı (bilgisayar) */

  --side-w: 248px;
  --mini-h: 68px;
  --bar-h: 88px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1211; --surface: #161b19; --surface-2: #1f2623; --fg: #ecf0ee; --muted: #98a49f; --line: #27302c;
    --accent: #5fd0a8; --accent-fg: #06221a; --accent-soft: #17312a; --danger: #f08a74; --warn-soft: #3a2c12; --warn-fg: #f3c37a; --tile-mix: 34%;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.4);
    --pl-base: #1d201f; --pl-fg: #f5f5f2; --pl-muted: rgba(245,245,242,.62); --pl-track: rgba(245,245,242,.22); --pl-accent: #6fd3c1; --pl-panel: #262a28;
    --pl-hover: rgba(255,255,255,.08); --pl-chip: rgba(255,255,255,.09); --pl-chip-hover: rgba(255,255,255,.16); --pl-chip-on-bg: #ffffff; --pl-chip-on-fg: #161817;
    --pl-play-bg: #ffffff; --pl-play-fg: #161817; --pl-thumb: #ffffff; --pl-line: rgba(255,255,255,.1); --pl-err: #ffb4a3;
    --pl-mini-mix: 30%; --pl-tint: 34%; --pl-tint-top: 52%; --pl-end: #121514;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1211; --surface: #161b19; --surface-2: #1f2623; --fg: #ecf0ee; --muted: #98a49f; --line: #27302c;
  --accent: #5fd0a8; --accent-fg: #06221a; --accent-soft: #17312a; --danger: #f08a74; --warn-soft: #3a2c12; --warn-fg: #f3c37a; --tile-mix: 34%;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.4);
  --pl-base: #1d201f; --pl-fg: #f5f5f2; --pl-muted: rgba(245,245,242,.62); --pl-track: rgba(245,245,242,.22); --pl-accent: #6fd3c1; --pl-panel: #262a28;
  --pl-hover: rgba(255,255,255,.08); --pl-chip: rgba(255,255,255,.09); --pl-chip-hover: rgba(255,255,255,.16); --pl-chip-on-bg: #ffffff; --pl-chip-on-fg: #161817;
  --pl-play-bg: #ffffff; --pl-play-fg: #161817; --pl-thumb: #ffffff; --pl-line: rgba(255,255,255,.1); --pl-err: #ffb4a3;
  --pl-mini-mix: 30%; --pl-tint: 34%; --pl-tint-top: 52%; --pl-end: #121514;
  color-scheme: dark;
}
@media (min-width: 768px) { :root { --gutter-l: max(28px, env(safe-area-inset-left, 0px)); --gutter-r: max(28px, env(safe-area-inset-right, 0px)); } }
@media (min-width: 1280px) { :root { --gutter-l: 40px; --gutter-r: 40px; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--fs-base); line-height: 1.5; font-weight: 400;
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
body.has-mini { padding-bottom: calc(var(--mini-h) + 24px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
img { max-width: 100%; display: block; }
svg { display: block; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Sol menü (yalnızca bilgisayar) ---------- */
.side { display: none; }
.brand { display: flex; align-items: center; gap: 10px; font-size: var(--fs-lg); font-weight: 800; letter-spacing: -.02em; }
.brand .logo { width: 30px; height: 30px; flex: none; border-radius: 8px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a, .nav button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: var(--fs-sm); font-weight: 600; width: 100%; }
.nav a:hover, .nav button:hover { background: var(--surface-2); color: var(--fg); }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
.side-recent { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; }
.side-recent button { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; }
.side-recent button:hover { background: var(--surface-2); }
.side-recent img { height: 40px; width: auto; margin: 0 auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
.side-recent strong { display: block; font-size: var(--fs-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-recent small { display: block; font-size: var(--fs-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-acct { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); width: 100%; }
.side-acct:hover { border-color: var(--accent); }
.side-acct .avatar { width: 36px; height: 36px; }
.side-acct strong { display: block; font-size: var(--fs-sm); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-acct small { display: block; font-size: var(--fs-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Tema seçici ---------- */
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 4px; border-radius: 9px; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.seg.big button { padding: 12px 6px; font-size: var(--fs-sm); flex-direction: column; gap: 6px; }
.seg.big svg { width: 22px; height: 22px; }
.appbar-acts { display: flex; align-items: center; gap: 8px; }
.themebtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); }
.themebtn:hover { background: var(--line); }
.themebtn svg { width: 20px; height: 20px; fill: currentColor; }

/* ---------- Üst çubuk (telefon) ---------- */
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 4px; }
.page-title { display: none; font-size: var(--fs-3xl); font-weight: 800; letter-spacing: -.025em; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); overflow: hidden; font-weight: 800; font-size: var(--fs-base); flex: none; }
.avatar svg { width: 22px; height: 22px; fill: currentColor; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- Raflar ---------- */
.shelf { padding-top: 24px; }
.shelf-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.shelf-h h2 { font-size: var(--fs-xl); }
.shelf-h .acts { display: flex; align-items: center; gap: 4px; margin-right: -8px; }
.shelf-h button { height: 36px; min-width: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; font-size: var(--fs-sm); font-weight: 700; color: var(--muted); }
.shelf-h button:hover { background: var(--surface-2); color: var(--fg); }
.shelf-h button:disabled { opacity: .3; cursor: default; background: none; }
.shelf-h svg { width: 22px; height: 22px; fill: currentColor; }
.shelf-h .more span { display: none; }
.shelf-h .scr { display: none; }

.rail {
  display: grid; grid-auto-flow: column; grid-auto-columns: clamp(118px, 30vw, 172px); gap: 12px;
  overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth;
  /* telefonda raf ekran kenarına taşar, son kart yarım görünür */
  margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r));
  padding: 2px var(--gutter-r) 8px var(--gutter-l); scroll-padding-left: var(--gutter-l);
}
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
.rail.wide { grid-auto-columns: clamp(260px, 80vw, 360px); }

.book { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tile {
  position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 10px; overflow: hidden;
  background: color-mix(in srgb, var(--tint, #888) var(--tile-mix), var(--surface));
  display: grid; place-items: center;
}
.tile img { width: 84%; height: 88%; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,.22)); transition: transform .25s ease; }
.book:hover .tile img { transform: translateY(-3px) scale(1.02); }
.tile .pct { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.55); overflow: hidden; }
.tile .pct i { display: block; height: 100%; background: var(--accent); }
.book .t { font-size: var(--fs-sm); font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.book .m { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.cont { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.cont:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.cont .tile { border-radius: 8px; }
.cont .t { font-size: var(--fs-sm); font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cont .s { font-size: var(--fs-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.cont .cbar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 10px; overflow: hidden; }
.cont .cbar i { display: block; height: 100%; background: var(--accent); }

.signin-hint { margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); width: 100%; text-align: left; }
.signin-hint svg { width: 22px; height: 22px; fill: var(--accent); flex: none; }
.signin-hint span { flex: 1; min-width: 0; font-size: var(--fs-sm); }
.signin-hint b { color: var(--accent); white-space: nowrap; font-size: var(--fs-sm); font-weight: 700; }

.foot { font-size: var(--fs-xs); color: var(--muted); padding-block: 36px 16px; text-align: center; }

/* ---------- Alt sayfa başlığı ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.topbar .wrap { display: flex; align-items: center; gap: 6px; min-height: 56px; }
.topbar h1 { font-size: var(--fs-lg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-left: -8px; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn svg { width: 24px; height: 24px; fill: currentColor; }

.shelf-h .count { font-size: var(--fs-sm); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 12px; padding-bottom: 8px; }
@media (max-width: 340px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px 18px; } }

/* ---------- Kitap detayı ---------- */
.hero { position: relative; margin-top: -56px; padding-top: 56px; background: linear-gradient(180deg, color-mix(in srgb, var(--tint, #888) calc(var(--tile-mix) + 10%), var(--bg)) 0%, var(--bg) 100%); }
.detail-grid { display: block; }
.d-info { display: flex; flex-direction: column; align-items: center; text-align: center; padding-block: 8px 22px; gap: 6px; }
.d-info img { width: min(46vw, 210px); filter: drop-shadow(0 14px 22px rgba(0,0,0,.28)); margin-bottom: 12px; }
.d-info h2 { font-size: var(--fs-2xl); font-weight: 800; }
.d-info .sub { font-size: var(--fs-base); color: var(--muted); margin: 0; }
.d-info .meta { font-size: var(--fs-sm); color: var(--muted); display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.d-info .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
.cta { margin-top: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 220px; padding: 13px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: var(--fs-base); font-weight: 700; box-shadow: var(--shadow); }
.cta svg { width: 20px; height: 20px; fill: currentColor; }
.d-list { min-width: 0; }
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 10px; }
.listhead h3 { font-size: var(--fs-xl); }
.listhead small { font-size: var(--fs-sm); color: var(--muted); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 0 12px; margin-bottom: 6px; }
.search svg { width: 18px; height: 18px; fill: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; font-size: var(--fs-base); padding: 11px 0; outline: none; }

.list { list-style: none; margin: 0; padding: 0 0 20px; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; align-items: center; gap: 10px; width: 100%; padding: 8px 4px; border-bottom: 1px solid var(--line); border-radius: 0; }
.row:hover { background: var(--surface); }
.row .no { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.row .nm { min-width: 0; }
.row .nm span { display: block; font-size: var(--fs-sm); font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.row .nm small { display: block; font-size: var(--fs-xs); line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .go { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
.row .go svg { width: 14px; height: 14px; fill: currentColor; }
.row.done .nm span { color: var(--muted); font-weight: 500; }
.row.done .go { background: var(--accent-soft); color: var(--accent); }
.row.current .nm span { color: var(--accent); }
.row.current .go { background: var(--accent); color: var(--accent-fg); }
.row .dur { display: none; }
.row .pbar { height: 3px; border-radius: 3px; background: var(--surface-2); margin-top: 4px; overflow: hidden; max-width: 200px; }
.row .pbar i { display: block; height: 100%; background: var(--accent); }
.empty { color: var(--muted); padding: 32px 10px; text-align: center; font-size: var(--fs-sm); }

/* ---------- Çalar çubuğu (telefonda yüzen mini çalar) ---------- */
.bar {
  position: fixed; z-index: 30;
  left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  max-width: 680px; margin: 0 auto; height: var(--mini-h);
  background: color-mix(in srgb, var(--tint, #888) var(--pl-mini-mix), var(--pl-base)); color: var(--pl-fg);
  border: 1px solid var(--pl-line);
  border-radius: 16px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 0 8px 0 10px; overflow: hidden;
}
.bar-now { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; min-width: 0; height: 100%; text-align: left; }
.bar-now .thumb { width: 44px; height: 50px; display: grid; place-items: center; }
.bar-now img { max-height: 50px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
.bar-now strong, .bar-now small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-now strong { font-size: var(--fs-sm); font-weight: 700; }
.bar-now small { font-size: var(--fs-xs); color: var(--pl-muted); }
.bar-mid { display: flex; align-items: center; gap: 2px; }
.bar-mid .btns { display: flex; align-items: center; gap: 4px; }
.bar-mid .seekrow, .bar-mid [data-act="prev"], .bar-mid [data-act="next"], .bar-mid [data-skip="15"] { display: none; }
.bar-tools { display: none; }
.bar .line { position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--pl-track); border-radius: 2px; }
.bar .line i { display: block; height: 100%; width: 0; background: var(--pl-accent); border-radius: 2px; }

.ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--pl-fg); }
.ib:hover { background: var(--pl-hover); }
.ib svg { width: 26px; height: 26px; fill: currentColor; }
.ib.small svg { width: 22px; height: 22px; }
.ib:disabled { opacity: .3; cursor: default; background: none; }
.ib.round-play { background: var(--pl-play-bg); color: var(--pl-play-fg); width: 40px; height: 40px; }
.ib.round-play:hover { background: var(--pl-play-bg); transform: scale(1.04); }
.ib.round-play svg { width: 22px; height: 22px; }

/* ---------- Tam ekran çalar ---------- */
.sheet {
  --pl-bg: color-mix(in srgb, var(--tint, #888) var(--pl-tint), var(--pl-base));
  position: fixed; inset: 0; z-index: 40; overflow-y: auto; overscroll-behavior: contain;
  color: var(--pl-fg);
  background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--tint, #888) var(--pl-tint-top), var(--pl-base)) 0%, var(--pl-bg) 55%, var(--pl-end) 100%);
  padding: env(safe-area-inset-top, 0px) var(--gutter-r) env(safe-area-inset-bottom, 0px) var(--gutter-l);
  transform: translateY(100%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s;
}
.sheet.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.sheet :focus-visible { outline-color: var(--pl-accent); }
.sheet-in { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.sheet-top { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding-top: 6px; margin-inline: -8px; }
.sheet-top span { text-align: center; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pl-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.ctrls { flex: 1; display: flex; flex-direction: column; gap: 16px; }

.art {
  width: min(100%, 38vh, 380px); aspect-ratio: 1; margin: 0 auto; border-radius: 18px; overflow: hidden;
  background: color-mix(in srgb, var(--tint, #888) 55%, #f3efe6); display: grid; place-items: center;
  box-shadow: 0 18px 40px rgba(0,0,0,.35);
}
.art img { height: 86%; width: auto; max-width: 86%; object-fit: contain; filter: drop-shadow(0 10px 16px rgba(0,0,0,.3)); }
.now { text-align: center; margin-top: 4px; }
.now .eyebrow { color: var(--pl-muted); display: none; margin-bottom: 6px; }
.now h3 { font-size: var(--fs-xl); margin-bottom: 4px; }
.now p { margin: 0; color: var(--pl-muted); font-size: var(--fs-sm); }

.seek { display: flex; flex-direction: column; gap: 2px; }
.times { display: flex; justify-content: space-between; color: var(--pl-muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; --p: 0%; touch-action: pan-y; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(90deg, var(--pl-accent) var(--p), var(--pl-track) var(--p)); }
input[type=range]::-moz-range-track { height: 5px; border-radius: 5px; background: var(--pl-track); }
input[type=range]::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--pl-accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--pl-thumb); margin-top: -7.5px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--pl-thumb); }

.jumps { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.vol { display: grid; grid-template-columns: 36px minmax(0, 1fr) 30px; align-items: center; gap: 8px; width: min(100%, 340px); margin: 10px auto 0; }
.vol[hidden] { display: none; }
.vol-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--pl-fg); }
.vol-btn:hover { background: var(--pl-hover); }
.vol-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.vol-btn .vx, .vol.off .vol-btn .vw { display: none; }
.vol.off .vol-btn .vx { display: inline; }
.vol output { font-size: var(--fs-xs); font-weight: 600; color: var(--pl-muted); text-align: right; font-variant-numeric: tabular-nums; }
.jump { padding: 6px 12px; border-radius: 999px; background: var(--pl-chip); font-size: var(--fs-xs); font-weight: 700; color: var(--pl-fg); font-variant-numeric: tabular-nums; }
.jump:hover { background: var(--pl-chip-hover); }
.jump:active { transform: scale(.95); }

.transport { display: flex; align-items: center; justify-content: space-between; padding-inline: 4px; }
.transport .play { width: 80px; height: 80px; border-radius: 50%; background: var(--pl-play-bg); color: var(--pl-play-fg); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.transport .play svg { width: 36px; height: 36px; fill: currentColor; }
.transport .play:active { transform: scale(.96); }
.sk { position: relative; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: var(--pl-fg); }
.sk:hover { background: var(--pl-hover); }
.sk:active { transform: scale(.94); }
.sk svg { width: 54px; height: 54px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sk b { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--fs-base); font-weight: 600; padding-top: 4px; font-variant-numeric: tabular-nums; }
.sk.mini { width: 40px; height: 40px; }
.sk.mini svg { width: 32px; height: 32px; stroke-width: 1.8; }
.sk.mini b { font-size: .625rem; font-weight: 700; padding-top: 3px; }
.tn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--pl-muted); }
.tn:hover { color: var(--pl-fg); background: var(--pl-hover); }
.tn svg { width: 24px; height: 24px; fill: currentColor; }
.tn:disabled { opacity: .3; cursor: default; background: none; }

.tools { margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-block: 10px 8px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; color: var(--pl-fg); }
.tool:hover { background: var(--pl-hover); }
.tool svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool span { font-size: var(--fs-xs); font-weight: 600; color: var(--pl-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tool.on, .tool.on span { color: var(--pl-accent); }

.err { color: var(--pl-err); font-size: var(--fs-sm); margin-top: 6px !important; }

/* ---------- Paneller (hız, uyku, bölümler, hesap) ---------- */
.pop { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.pop-bg { position: absolute; inset: 0; background: rgba(0,0,0,.45); animation: fade .2s ease; }
.pop-card {
  position: relative; width: 100%; max-width: 520px; max-height: min(82vh, 720px); overflow-y: auto; overscroll-behavior: contain;
  border-radius: 22px 22px 0 0; padding: 8px var(--gutter-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  animation: up .26s cubic-bezier(.2,.8,.2,1);
}
/* "dark" paneller (hız, uyku, bölümler, paylaş, not) artık çaların renklerini izler: açık temada açık */
.pop.dark .pop-card { background: var(--pl-panel); color: var(--pl-fg); --muted-c: var(--pl-muted); --chip: var(--pl-chip); --chip-on-bg: var(--pl-chip-on-bg); --chip-on-fg: var(--pl-chip-on-fg); --ln: var(--pl-line); --acc: var(--pl-accent); box-shadow: 0 -8px 40px rgba(0,0,0,.18); }
.pop.light .pop-card { background: var(--surface); color: var(--fg); --muted-c: var(--muted); --chip: var(--surface-2); --chip-on-bg: var(--accent); --chip-on-fg: var(--accent-fg); --ln: var(--line); --acc: var(--accent); }
@media (min-width: 600px) { .pop { align-items: center; padding: 24px; } .pop-card { border-radius: 20px; padding: 20px 24px 24px; } .grab { display: none; } }
.grab { width: 40px; height: 4px; border-radius: 4px; background: currentColor; opacity: .25; margin: 4px auto 10px; }
.pop-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.pop-h h4 { font-size: var(--fs-lg); font-weight: 800; }
.pop-h output { font-size: var(--fs-xl); font-weight: 800; font-variant-numeric: tabular-nums; }
.x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); flex: none; }
.x svg { width: 18px; height: 18px; fill: currentColor; }

.speed-ctrl { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 10px; margin-bottom: 14px; }
.speed-ctrl button { width: 40px; height: 40px; border-radius: 50%; background: var(--chip); font-size: var(--fs-lg); font-weight: 800; display: grid; place-items: center; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.chip { padding: 10px 6px; border-radius: 12px; background: var(--chip); font-size: var(--fs-sm); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-fg); }
.note { color: var(--muted-c); font-size: var(--fs-sm); margin: 12px 0 0; }

.opts { display: flex; flex-direction: column; }
.opt { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px; border-bottom: 1px solid var(--ln); font-size: var(--fs-base); font-weight: 600; }
.opt svg { width: 20px; height: 20px; fill: var(--acc); visibility: hidden; }
.opt[aria-pressed="true"] { color: var(--acc); }
.opt[aria-pressed="true"] svg { visibility: visible; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--chip); margin-bottom: 8px; }
.tabs button { padding: 8px; border-radius: 9px; font-size: var(--fs-sm); font-weight: 700; text-align: center; color: var(--muted-c); }
.tabs button[aria-selected="true"] { background: var(--chip-on-bg); color: var(--chip-on-fg); }
.plist { list-style: none; margin: 0; padding: 0; }
.prow { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; padding: 12px 2px; border-bottom: 1px solid var(--ln); }
.prow .no { font-size: var(--fs-xs); color: var(--muted-c); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.prow .nm { min-width: 0; font-size: var(--fs-sm); font-weight: 600; overflow-wrap: anywhere; }
.prow .nm small { display: block; font-weight: 500; color: var(--muted-c); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.prow.current .nm, .prow.current .no { color: var(--acc); }
.prow.done .nm { color: var(--muted-c); font-weight: 500; }
.bm { display: grid; grid-template-columns: minmax(0, 1fr) 36px 36px; align-items: center; gap: 4px; border-bottom: 1px solid var(--ln); }
.prow .nm em { display: block; font-style: normal; font-weight: 700; color: var(--acc); }
.bm .prow { border-bottom: 0; }
.bm .del { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted-c); }
.bm .del svg { width: 18px; height: 18px; fill: currentColor; }

/* Hesap paneli */
.acct p { color: var(--muted-c); margin: 0 0 16px; font-size: var(--fs-sm); }
.gbtn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 13px; border-radius: 12px; border: 1px solid var(--ln); background: var(--surface); font-size: var(--fs-base); font-weight: 700; }
.gbtn:hover { border-color: var(--acc); }
.gbtn svg { width: 20px; height: 20px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted-c); font-size: var(--fs-xs); margin: 16px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--ln); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: var(--fs-sm); font-weight: 600; }
.field input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--ln); background: var(--bg); font-size: var(--fs-base); outline: none; }
.field input:focus { border-color: var(--acc); }
.pbtn { width: 100%; padding: 13px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-size: var(--fs-base); font-weight: 700; text-align: center; }
.pbtn:disabled { opacity: .6; }
.links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: var(--fs-sm); }
.links button { color: var(--acc); font-weight: 700; }
.msg { font-size: var(--fs-sm); margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; }
.msg.bad { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.msg.ok { background: var(--accent-soft); color: var(--accent); }
.me { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.me .avatar { width: 56px; height: 56px; font-size: var(--fs-xl); }
.me strong { display: block; font-size: var(--fs-lg); font-weight: 700; overflow-wrap: anywhere; }
.me small { font-size: var(--fs-sm); color: var(--muted-c); }
.sbtn { width: 100%; padding: 12px; border-radius: 12px; background: var(--chip); font-size: var(--fs-base); font-weight: 700; text-align: center; margin-top: 8px; }

.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: #111; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.3); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; animation: fade .2s ease; }

/* ---------- Tüm kitaplarda arama ---------- */
.gsearch { margin-top: 14px; }
.gsearch .search { margin: 0; }
.results { padding-top: 18px; }
.results .rh { font-size: var(--fs-sm); color: var(--muted); margin: 0 0 10px; }
.rbooks { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.rbook { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: var(--fs-sm); font-weight: 600; }
.rbook:hover { border-color: var(--accent); }
.rbook img { height: 30px; width: auto; }
.srow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.srow:hover { background: var(--surface); }
.srow img { height: 40px; width: auto; margin: 0 auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
.srow strong { display: block; font-size: var(--fs-sm); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.srow small { display: block; font-size: var(--fs-xs); color: var(--muted); line-height: 1.3; }
.srow .d { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.srow.current strong { color: var(--accent); }
mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---------- Uygulamayı yükle ---------- */
.install-hint { margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.install-hint img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.install-hint span { flex: 1; min-width: 0; font-size: var(--fs-sm); line-height: 1.35; }
.install-hint span b { display: block; }
.install-hint .go { padding: 8px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: var(--fs-sm); font-weight: 700; flex: none; }
.install-hint .x { background: none; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: var(--fs-sm); }
.steps svg { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; fill: currentColor; }

/* ---------- Paylaş ---------- */
.share-link { font-size: var(--fs-xs); background: var(--chip); padding: 10px 12px; border-radius: 10px; word-break: break-all; color: var(--muted-c); margin-top: 4px; }
.chk { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); margin: 14px 0 10px; }
.chk input { width: 18px; height: 18px; accent-color: var(--acc); margin: 0; }
.chk input[type=text] { width: 76px; height: auto; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--ln); background: transparent; color: inherit; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 14px; }
.btn2 { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; background: var(--chip); font-size: var(--fs-sm); font-weight: 700; text-align: center; text-decoration: none; color: inherit; }
.btn2 svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
.btn2.primary { background: var(--chip-on-bg); color: var(--chip-on-fg); }
.note-in { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--ln); background: transparent; color: inherit; font-size: var(--fs-base); outline: none; }
.note-in:focus { border-color: var(--acc); }

/* ---------- İstatistikler ---------- */
.stats-wrap { padding-bottom: 32px; }
.stats-wrap h2.pt { font-size: var(--fs-2xl); font-weight: 800; padding-block: 4px 4px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.kpi small { display: block; font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }
.kpi strong { display: block; font-size: var(--fs-xl); font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .sub { font-size: var(--fs-xs); color: var(--muted); }
.kpi .gbar { height: 6px; border-radius: 6px; background: var(--surface-2); margin-top: 10px; overflow: hidden; }
.kpi .gbar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
.card h3 { font-size: var(--fs-lg); margin-bottom: 14px; }
.card .hint { font-size: var(--fs-sm); color: var(--muted); margin: -6px 0 14px; }
.plot { position: relative; height: 150px; }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; height: 100%; align-items: end; }
.bw { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.bw .b { width: min(100%, 40px); background: var(--accent); opacity: .5; border-radius: 4px 4px 0 0; min-height: 2px; }
.bw.today .b { opacity: 1; }
.bw .v { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bw.today .v { color: var(--fg); font-weight: 700; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed color-mix(in srgb, var(--muted) 70%, transparent); pointer-events: none; }
.goal-line span { position: absolute; right: 0; top: -18px; font-size: var(--fs-xs); color: var(--muted); background: var(--surface); padding-left: 6px; }
.blabels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
.blabels span { text-align: center; font-size: var(--fs-xs); color: var(--muted); }
.blabels span.today { color: var(--fg); font-weight: 700; }
.bprog { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
.bprog:last-child { border-bottom: 0; }
.bprog img { height: 42px; width: auto; margin: 0 auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
.bprog strong { display: block; font-size: var(--fs-sm); font-weight: 600; }
.bprog small { display: block; font-size: var(--fs-xs); color: var(--muted); }
.bprog .pb { height: 5px; border-radius: 5px; background: var(--surface-2); margin: 5px 0 3px; overflow: hidden; }
.bprog .pb i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.bprog .pc { font-size: var(--fs-sm); font-weight: 700; font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { padding: 8px 14px; border-radius: 999px; background: var(--surface-2); font-size: var(--fs-sm); font-weight: 700; font-variant-numeric: tabular-nums; }

<script>
(() => {
  const $ = id => document.getElementById(id);
  const $$ = sel => document.querySelectorAll(sel);
  const audio = $('audio');
  const SPEED_PRESETS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 3];
  const SLEEP_OPTS = [[0, 'Kapalı'], [5, '5 dakika'], [10, '10 dakika'], [15, '15 dakika'], [30, '30 dakika'], [45, '45 dakika'], [60, '1 saat'], ['end', 'Bölüm bitince']];

  const store = {
    get(k, d) { try { const v = localStorage.getItem('skr:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('skr:' + k, JSON.stringify(v)); } catch {} }
  };

  // "MEKTÛBÂT TERCEMESİ" -> "Mektûbât Tercemesi" (books.json'da düzgün ad yoksa)
  function prettyTitle(raw) {
    const words = raw.split(/\s+/);
    // Alt başlık yalnızca büyük harfli başlıktan sonra gelen normal yazılı kısımdır
    const allCaps = w => w === w.toLocaleUpperCase('tr');
    const cut = allCaps(words[0]) ? words.findIndex((w, i) => i > 0 && /\p{Lu}/u.test(w[0]) && /\p{Ll}/u.test(w.slice(1))) : -1;
    const head = cut > 0 ? words.slice(0, cut) : words;
    const sub = cut > 0 ? words.slice(cut).join(' ') : '';
    const out = [];
    for (const w of head) {
      const low = w.toLocaleLowerCase('tr');
      if (['ı', 'i', 'un', 'ün'].includes(low) && out.length) { out[out.length - 1] += '-' + low; continue; }
      out.push(low === 've' ? low : low.charAt(0).toLocaleUpperCase('tr') + low.slice(1));
    }
    return { title: out.join(' '), sub };
  }

  // Kalıcı anahtarlar: "3_Herkese_Lazim_Olan_Iman|01_Onsoz" — liste yeniden üretilse de değişmez
  const trackKey = url => url.split('/').slice(-2).join('|').replace(/\.mp3$/i, '');
  const byKey = new Map();
  const books = (window.BOOKS || []).map((b, i) => {
    const tracks = b.tracks.map((t, j) => ({ ...t, key: trackKey(t.url), no: (t.url.split('/').pop().match(/^(\d+)/) || [, String(j + 1)])[1] }));
    const pt = prettyTitle(b.title);
    const book = { ...b, title: b.name || pt.title, sub: pt.sub, id: i, key: b.key || tracks[0]?.key.split('|')[0] || String(i), tracks, total: tracks.reduce((n, t) => n + (t.dur || 0), 0) };
    tracks.forEach((t, j) => byKey.set(t.key, { b: i, t: j }));
    return book;
  });
  const bookByKey = k => books.find(b => b.key === k);
  // Kitaplar rafta, seriler Sesli Yayınlar sekmesinde görünür; çalma, kayıt ve arama ikisinde de aynıdır
  const shelfBooks = books.filter(b => b.section !== 'seri');
  const seriesBooks = books.filter(b => b.section === 'seri');

  // ---------- Durum: yerelde saklanır, giriş yapılmışsa hesapla senkronlanır ----------
  // progress[trackKey] = {pos, dur, done, at}; bookmarks[id] = {k, pos, note?, at, deleted?}
  // daily[cihaz][YYYY-AA-GG] = dinlenen saniye (her cihaz kendi sayacını tutar, toplam = hepsinin toplamı)
  // last / lastByBook / recent / speed / goal: updatedAt'ı yeni olan taraf kazanır
  // epoch: "şu andan önceki kayıtları sil" zamanları (silme işlemi senkronla diğer cihazlara da geçsin diye)
  // plans[kitap] = {start, end (YYYY-AA-GG), base: plan başında dinlenmiş içerik sn, snap: {day, listened} (yalnız geçiş günü için), at, deleted?}
  // dayBooks / dayContent[cihaz][gün][kitap] = o gün o kitapta dinlenen gerçek / içerik saniyesi
  // rounds[kitap]: dinleyişler (aşağıda "Dinleyişler" bölümünde)
  const DEF = () => ({ v: 2, progress: {}, bookmarks: {}, daily: {}, plans: {}, rounds: {}, dayDel: {}, dayBooks: {}, dayContent: {}, last: null, lastByBook: {}, recent: [], speed: 1, goal: 15, updatedAt: 0, epoch: { progress: 0, bookmarks: 0, daily: 0, plans: 0, rounds: 0 } });
  let state = loadState();
  const DEVICE = store.get('device', null) || (() => { const id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); store.set('device', id); return id; })();

  function loadState() {
    const s = store.get('state', null);
    if (s && s.v === 2) { const d = DEF(); return { ...d, ...s, epoch: { ...d.epoch, ...(s.epoch || {}) } }; }
    // Eski sürümden (url ve sıra numarasıyla tutulan) kayıtları taşı
    const m = DEF();
    for (const [url, p] of Object.entries(store.get('progress', {}))) m.progress[trackKey(url)] = { ...p, at: Date.now() };
    const oldLast = store.get('last', null);
    if (oldLast && books[oldLast.b]?.tracks[oldLast.t]) m.last = books[oldLast.b].tracks[oldLast.t].key;
    for (const [bi, ti] of Object.entries(store.get('lastByBook', {}))) if (books[bi]?.tracks[ti]) m.lastByBook[books[bi].key] = books[bi].tracks[ti].key;
    m.recent = store.get('recent', []).filter(bi => books[bi]).map(bi => books[bi].key);
    m.speed = store.get('speed', 1);
    m.updatedAt = Date.now();
    return m;
  }
  function persist(scalars) {
    if (scalars) state.updatedAt = Date.now();
    store.set('state', state);
    window.skrSync?.push();
  }
  // Silme zamanından eski kayıtları at (başka cihazdan gelen silme işlemi dahil)
  function pruneOld() {
    const e = state.epoch;
    for (const [k, v] of Object.entries(state.progress)) if ((v.at || 0) < e.progress) delete state.progress[k];
    for (const [k, v] of Object.entries(state.bookmarks)) if ((v.at || 0) < e.bookmarks) delete state.bookmarks[k];
    for (const [k, v] of Object.entries(state.plans)) if ((v.at || 0) < e.plans) delete state.plans[k];
    for (const [k, r] of Object.entries(state.rounds)) {
      for (const [n, h] of Object.entries(r.hist || {})) if ((h.at || 0) < e.rounds) delete r.hist[n];
      if ((r.at || 0) < e.rounds) r.cur = null;
      if (!r.cur && !Object.keys(r.hist || {}).length) delete state.rounds[k];
    }
    // Silinmiş günlerin eski sayaçları (dinleme geçmişi ve dinleyiş süreleri)
    const dropDead = by => { for (const v of Object.values(by || {})) if (v && typeof v === 'object') for (const s of Object.keys(v)) if (!liveBucket(s)) delete v[s]; };
    dropDead(state.daily); dropDead(state.dayBooks); dropDead(state.dayContent);

  // Silme işlemleri beklemeden hesaba yazılır
  const saveNow = () => { persist(true); window.skrSync?.flush(); };

  let cur = null; // {b, t}
  let viewBook = null;
  let speed = state.speed || 1;
  let user = null;

  const fmt = s => {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`;

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/>';
  const ICON_CHECK = '<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>';
  const ICON_X = '<svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>';
  const ICON_USER = '<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z"/></svg>';
  const ICON_CHEV_L = '<svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>';
  const ICON_CHEV_R = '<svg viewBox="0 0 24 24"><path d="M8.6 16.6 13.2 12 8.6 7.4 10 6l6 6-6 6z"/></svg>';

  const prog = t => state.progress[t.key];
  const doneCount = b => b.tracks.filter(t => prog(t)?.done).length;
  const listened = b => b.tracks.reduce((n, t) => { const p = prog(t); return n + (p?.done ? (t.dur || p.dur || 0) : (p?.pos || 0)); }, 0);
  const bookPct = b => b.total ? Math.min(100, listened(b) / b.total * 100) : 0;
  const lastInBook = bi => { const k = state.lastByBook[books[bi]?.key]; const r = k && byKey.get(k); return r && r.b === bi ? r.t : null; };

  // ---------- Dinleyişler: bir kitabın her baştan sona dinlenişi ayrı kaydedilir ----------
  // rounds[kitap] = { cur: {n, start, sec: {cihaz: sn}, partial?} | null, at, hist: {n: {start, end, sec, manual?, plan?, at, deleted?}} }
  // cur yoksa ve hist doluysa kitap "bitti" durumundadır; yeni dinleyiş kullanıcının onayıyla başlar
  const TEFSIR_KEY = 'seri-4443';
  const countsRounds = b => b && (b.section !== 'seri' || b.key === TEFSIR_KEY); // ilahi, şiir, marş sayılmaz
  const roundWord = b => b.key === TEFSIR_KEY ? 'hatim' : 'dinleyiş';
  const roundRec = b => state.rounds[b.key];
  const pastRounds = b => Object.entries(roundRec(b)?.hist || {}).filter(([, h]) => !h.deleted).map(([n, h]) => ({ ...h, n: +n })).sort((x, y) => x.n - y.n);
  const finishCount = b => pastRounds(b).length;
  const isFinished = b => { const r = roundRec(b); return !!r && !r.cur && finishCount(b) > 0; };
  const roundNo = b => roundRec(b)?.cur?.n || finishCount(b) + 1;
  // sec: {cihaz: {gün: sn}} (ilk sürümde {cihaz: sn} idi; o sayı günü bilinmeyen pay olarak "_" altında tutulur)
  const devSec = (c, dev) => { const v = c.sec[dev]; if (typeof v !== 'object' || !v) c.sec[dev] = v ? { _: v } : {}; return c.sec[dev]; };
  const secOf = by => Object.values(by || {}).reduce((n, v) => n + (typeof v === 'number' ? v : Object.entries(v || {}).reduce((m, [k, s]) => m + (liveBucket(k) ? s : 0), 0)), 0);
  const roundSec = c => secOf(c?.sec);
  const histSec = h => h.secBy ? Math.round(secOf(h.secBy)) : h.sec;
  const progAts = b => b.tracks.map(t => prog(t)?.at).filter(Boolean);
  // Bu dinleyişte başlanan kitap: yeni kayıt açılır; eskiden başlanmışsa süre ve hız eksik kalacağı için işaretlenir
  function ensureRound(b) {
    if (!countsRounds(b) || isFinished(b)) return null;
    const r = (state.rounds[b.key] ||= { cur: null, at: 0, hist: {} });
    if (!r.cur) {
      const ats = progAts(b);
      r.cur = { n: finishCount(b) + 1, start: ats.length ? Math.min(...ats) : Date.now(), sec: {}, partial: ats.length ? true : undefined };
      r.at = Date.now();
    }
    return r.cur;
  }
  function closeRound(b, manual) {
    const now = Date.now(), legacy = !roundRec(b);
    const r = (state.rounds[b.key] ||= { cur: null, at: 0, hist: {} });
    const ats = progAts(b);
    const c = r.cur || { n: finishCount(b) + 1, start: ats.length ? Math.min(...ats) : now, sec: {}, partial: true };
    const pl = activePlan(b);
    // Eski sürümde bitmiş kitap: bitiş günü olarak son dinlenen bölümün tarihi alınır
    const end = legacy && ats.length ? Math.max(...ats) : now;
    // secBy: gün gün süreler saklanır ki sonradan bir gün silinince bitmiş dinleyişin süresi de düzelsin
    r.hist[c.n] = { start: c.start, end, sec: c.partial ? null : Math.round(roundSec(c)), secBy: c.partial ? undefined : c.sec, manual: manual || undefined,
      plan: pl ? { start: pl.start, end: pl.end, late: Math.max(0, dayDiff(pl.end, dayKey(new Date(end)))) } : undefined, at: now };
    r.cur = null; r.at = now;

  // Bütün bölümleri dinlenmiş kitapları kapat (çalarken, açılışta ve hesapla birleştirince)
  function checkRounds(celebrateBook) {
    let changed = false;
    for (const b of books) {
      // İşaretler bu dinleyiş başladıktan sonra konmuş olmalı (önceki dinleyişten kalan işaretler sayılmaz)
      const since = roundRec(b)?.cur?.start || 0;
      if (!countsRounds(b) || isFinished(b) || !b.tracks.every(t => prog(t)?.done && (prog(t).at || 0) >= since)) continue;
      const res = closeRound(b, false); changed = true;
      if (b === celebrateBook && !res.legacy) setTimeout(() => celebrate(b, res), 400);
    }
    if (changed) saveNow();
  }
  function startRound(b) {
    const now = Date.now(), r = (state.rounds[b.key] ||= { cur: null, at: 0, hist: {} });
    r.cur = { n: finishCount(b) + 1, start: now, sec: {} }; r.at = now;
    // Bölüm işaretleri yeni dinleyiş için temizlenir; eski dinleyişin özeti geçmişte kalır
    b.tracks.forEach(t => { if (state.progress[t.key]) state.progress[t.key] = { pos: 0, dur: state.progress[t.key].dur || t.dur || 0, done: false, at: now }; });
    if (state.plans[b.key]) state.plans[b.key] = { deleted: true, at: now };
    delete state.lastByBook[b.key];
    saveNow();
    return r.cur.n;
  }

  // ---------- Dinleme süresi (istatistikler için) ----------
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  // Tek gün silme: dayDel[gün] = silme zamanı. Sayaçlar yalnızca artıp birleştirmede büyük olan kaldığı için
  // silinen günün eski sayacı geri gelmesin diye, o günden sonraki dinleme "gün~silmeZamanı" adlı yeni sayaca yazılır.
  const bucket = (k = dayKey()) => state.dayDel?.[k] ? `${k}~${state.dayDel[k]}` : k;
  const liveBucket = s => { const [k, g] = String(s).split('~'); const d = state.dayDel?.[k]; return d ? g === String(d) : g === undefined; };
  const daySum = k => Object.values(state.daily || {}).reduce((n, dev) => n + (dev[bucket(k)] || 0), 0);
  // Kaydı olan günler (YYYY-AA-GG)
  const listenDays = () => [...new Set(Object.values(state.daily || {}).flatMap(Object.keys).filter(liveBucket).map(s => s.split('~')[0]))].filter(k => daySum(k) > 0);
  // Bir günde hangi kitaptan ne kadar dinlendi: {kitap anahtarı: sn} (tüm cihazlar toplanır)
  // dayBooks: gerçek süre (takvim); dayContent: aynı yapıda içerik süresi = gerçek süre × hız (okuma planı)
  const dayMap = (map, k) => {
    const out = {};
    for (const dev of Object.values(map || {})) for (const [bk, s] of Object.entries(dev[bucket(k)] || {})) out[bk] = (out[bk] || 0) + s;
    return out;
  };
  const dayBooks = k => dayMap(state.dayBooks, k);
  const addTo = (map, k, bk, s) => { const m = ((map[DEVICE] ||= {})[k] ||= {}); m[bk] = Math.round(((m[bk] || 0) + s) * 10) / 10; };
  const dayName = k => k === dayKey() ? 'Bugün' : k === addDays(dayKey(), -1) ? 'Dün' : new Date(k + 'T12:00:00').toLocaleDateString('tr', { weekday: 'long', day: 'numeric', month: 'long', ...(k.slice(0, 4) !== dayKey().slice(0, 4) ? { year: 'numeric' } : {}) });
  const dayLen = s => s < 60 ? `${Math.round(s)} sn` : human(s);
  function addListen(sec) {
    const d = (state.daily[DEVICE] ||= {});
    const k = bucket();
    d[k] = Math.round(((d[k] || 0) + sec) * 10) / 10;
    if (cur) { const bk = books[cur.b].key; addTo(state.dayBooks, k, bk, sec); addTo(state.dayContent, k, bk, sec * (audio.playbackRate || 1)); }
    // Dinleyişin süresi: her cihaz kendi payını gün gün tutar (birleştirmede büyük olan kalır; gün silinince düşer)

  }
  function deleteDay(k) {
    state.dayDel = { ...(state.dayDel || {}), [k]: Date.now() };

  }
  // Türkçe karakter ve şapkadan bağımsız arama: "Îmân" = "iman", "Şartları" = "sartlari"
  const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '')

  function toast(text) {

  // ---------- Kartlar ve raflar ----------

  function highlight(text, words) {
    // Eşleşen kelimeleri işaretle (şapka/Türkçe karakter farkını yok sayarak)

    const marks = new Array(src.length).fill(false);
    words.forEach(w => { let i = n.indexOf(w); while (i >= 0) { for (let k = i; k < i + w.length && k < src.length; k++) marks[k] = true; i = n.indexOf(w, i + w.length); } });
