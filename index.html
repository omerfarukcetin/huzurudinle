    host.innerHTML = `<div class="plan-card">
      <div class="plan-h"><strong>Okuma planı</strong><span class="plan-day">Gün ${pl.dayNo} / ${pl.totalDays}</span></div>
      <span class="chip-status ${pl.tone}">${esc(pl.status)}</span>
      ${pl.finished ? '' : `<div class="plan-today"><span>Bugün <b>${human(atSpeed(pl.doneToday)) || '0 dk'}</b> / ${human(atSpeed(pl.target)) || '1 dk'}</span><small>${fmtSpeed(speed)} hızda · hedef ${dateWords(pl.p.end)}</small></div>
      <div class="gbar"><i style="width:${pct.toFixed(1)}%"></i></div>`}
      ${tracks.length ? `<div class="plan-list"><small>Bugünün bölümleri</small>${tracks.slice(0, 5).map(x => { const t = b.tracks[x.t]; return `<button type="button" data-plan-t="${x.t}"><span class="no">${t.no}</span><span class="nm">${esc(t.name)}</span><span class="d">${x.partial ? `ilk ${human(atSpeed(x.part))}` : human(atSpeed(x.part))}</span></button>`; }).join('')}${tracks.length > 5 ? `<small>ve ${tracks.length - 5} bölüm daha</small>` : ''}</div>
        <button class="btn-plan" type="button" id="planGo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Bugünün planını dinle</button>` : ''}
      ${estLine}
      <div class="plan-acts"><button type="button" id="planInfo">Ayrıntılar</button><button type="button" id="planEdit">Planı değiştir</button><button type="button" id="planDel">Planı kaldır</button></div>
    </div>`;
    host.querySelectorAll('[data-plan-t]').forEach(x => x.onclick = () => play(b.id, +x.dataset.planT));
    host.querySelector('#planGo')?.addEventListener('click', () => { if (cur && cur.b === b.id && cur.t === tracks[0].t) { if (audio.paused) toggle(); } else play(b.id, tracks[0].t); });
    host.querySelector('#planInfo').onclick = () => openPlanDetail(b);
    host.querySelector('#planEdit').onclick = () => openPlanSetup(b);
    host.querySelector('#planDel').onclick = () => confirmPop('Planı kaldır', `<b>${esc(b.title)}</b> için okuma planı kaldırılacak. Dinleme ilerlemen kalır.`, 'Kaldır', () => { state.plans[b.key] = { deleted: true, at: Date.now() }; saveNow(); toast('Plan kaldırıldı'); route(); });
  }

  // ---------- Plan ayrıntıları: baştan beri ilerleme, gün gün takvim, beklenen–gerçek ----------
  // Süreler planın geri kalanı gibi içerik süresidir; ekranda seçili hızda geçen süre olarak gösterilir.
  function openPlanDetail(b) {
    const pl = planInfo(b); if (!pl) return;
    const p = pl.p, today = dayKey(), goalTotal = Math.max(1, b.total - p.base);
    const daily = goalTotal / pl.totalDays;                     // planın ortalama günlük hedefi
    const since = Math.max(0, pl.L - p.base);                   // plan başından beri dinlenen
    const pctPlan = Math.min(100, since / goalTotal * 100);
    const expNow = p.base + goalTotal * Math.min(1, pl.dayNo / pl.totalDays); // bugünün sonunda olunması gereken
    // Gün gün kayıt bu özellikten sonra başladı; öncesindeki günler "kayıt yok" görünür
    const firstTracked = Object.values(state.dayContent || {}).flatMap(Object.keys).map(k => k.slice(0, 10)).sort()[0] || today;
    const days = [];
    for (let i = 0; i < pl.totalDays; i++) {
      const k = addDays(p.start, i);
      const s = k === today ? pl.doneToday : (dayMap(state.dayContent, k)[b.key] || 0);
      const kind = k > today ? 'future' : k < firstTracked ? 'nodata' : s >= daily * 0.95 ? 'met' : s >= 60 ? 'part' : 'none';
      days.push({ k, s, kind, n: i + 1 });
    }
    const past = days.filter(d => d.k <= today && d.kind !== 'nodata');
    const met = past.filter(d => d.kind === 'met').length;
    const lead = (new Date(p.start + 'T12:00:00').getDay() + 6) % 7;
    const cls = { met: 'l4', part: 'l2', none: '', nodata: 'nodata', future: 'future' };
    const word = { met: 'hedef tuttu', part: 'kısmen', none: 'dinlenmedi', nodata: 'kayıt yok', future: 'henüz gelmedi' };
    const diff = pl.L - expNow;
    openPop(`<div class="pop-h"><h4>Okuma planı</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <p class="note" style="margin:0 0 12px"><b>${esc(b.title)}</b> · ${dateWords(p.start)} – ${dateWords(p.end)} · ${pl.totalDays} gün</p>
      <div class="pd-kpis">
        <div><small>Gün</small><strong>${pl.dayNo} / ${pl.totalDays}</strong></div>
        <div><small>Plan ilerlemesi</small><strong>%${Math.floor(pctPlan)}</strong></div>
        <div><small>Plan başından beri</small><strong>${human(atSpeed(since)) || '0 dk'}</strong></div>
      </div>
      <div class="gbar" style="margin:10px 0 4px"><i style="width:${pctPlan.toFixed(1)}%"></i></div>
      <p class="note" style="margin:0 0 14px">Bugünün sonu için plan: kitabın %${Math.floor(Math.min(100, expNow / b.total * 100))} kısmı · şu an: %${Math.floor(bookPct(b))}.
        ${pl.finished ? '' : Math.abs(diff) < 60 ? ' Tam plandasın.' : diff > 0 ? ` Plandan ${human(atSpeed(diff))} öndesin.` : ` Bugünün sonuna kadar ${human(atSpeed(-diff))} daha dinlemen gerekiyor.`}</p>
      <div class="setrow" style="border:0;padding:0 0 8px"><span>Günler${past.length ? ` · hedef tutulan gün: ${met} / ${past.length}` : ''}</span></div>
      <div class="cal-grid pd-cal">${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map(w => `<span class="wd">${w}</span>`).join('')}${'<span class="cal-day empty"></span>'.repeat(lead)}${days.map(d => {
        const label = `${dayName(d.k)} · ${d.n}. gün · ${d.kind === 'nodata' || d.kind === 'future' ? word[d.kind] : `${human(atSpeed(d.s)) || '0 dk'} · ${word[d.kind]}`}`;
        return `<span class="cal-day ${cls[d.kind]}${d.k === today ? ' today' : ''}" title="${esc(label)}" aria-label="${esc(label)}">${+d.k.slice(8)}</span>`;
      }).join('')}</div>
      <div class="cal-foot"><span class="cal-legend"><i class="cal-day l4"></i> Tuttu <i class="cal-day l2"></i> Kısmen <i class="cal-day"></i> Dinlenmedi${days.some(d => d.kind === 'nodata') ? ' <i class="cal-day nodata"></i> Kayıt yok' : ''}</span>
        <span>Günlük hedef ortalama ${human(atSpeed(daily)) || '1 dk'} (${fmtSpeed(speed)} hızda)</span></div>
      ${days.some(d => d.kind === 'nodata') ? '<p class="note" style="margin:10px 0 0">"Kayıt yok" günler bu ayrıntılar eklenmeden önceki günlerdir; o günlerde dinlediklerin plan ilerlemesine dahildir.</p>' : ''}`, { dark: false });
  }

  function openPlanSetup(b) {
    const rem = remainingOf(b), old = activePlan(b);
    const presets = [7, 14, 30, 60, 90];
    let days = old ? Math.max(1, dayDiff(dayKey(), old.end) + 1) : 30;
    openPop(`<div class="pop-h"><h4>Okuma planı</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <p class="note" style="margin:0 0 14px"><b>${esc(b.title)}</b> · kalan ${human(rem)} (1× hızda)</p>
      <div class="setrow" style="border:0;padding:0 0 8px"><span>Kaç günde bitirmek istiyorsun?</span></div>
      <div class="pills" id="planPills">${presets.map(v => `<button class="pill" type="button" data-days="${v}">${v} gün</button>`).join('')}</div>
      <label class="chk" style="margin-top:12px">ya da <input type="text" id="planDays" inputmode="numeric" aria-label="Gün sayısı" style="width:64px"> gün</label>
      <div class="plan-preview" id="planPreview"></div>
      <div class="btn-grid"><button class="btn2" type="button" data-close>Vazgeç</button><button class="btn2 primary" type="button" id="planSave">${old ? 'Planı güncelle' : 'Planı başlat'}</button></div>`, {
      dark: false,
      onMount(card) {
        const input = card.querySelector('#planDays');
        const paint = () => {
          card.querySelectorAll('[data-days]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.days === days));
          input.value = days;
          const per = rem / days, end = addDays(dayKey(), days - 1);
          card.querySelector('#planPreview').innerHTML = `<strong>Günde yaklaşık ${human(per) || '1 dk'}</strong>
            ${speed !== 1 ? `<span>${fmtSpeed(speed)} hızda ${human(atSpeed(per)) || '1 dk'}</span>` : ''}
            <span>Bitiş: ${dateWords(end)}</span>
            ${per > 3 * 3600 ? '<span class="warn">Bu plan günde 3 saatten fazla dinlemek demek; daha uzun bir süre seçebilirsin.</span>' : ''}`;
        };
        card.querySelectorAll('[data-days]').forEach(x => x.onclick = () => { days = +x.dataset.days; paint(); });
        input.oninput = () => { const n = parseInt(input.value, 10); if (n >= 1 && n <= 730) { days = n; card.querySelectorAll('[data-days]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.days === days)); const per = rem / days; card.querySelector('#planPreview strong').textContent = `Günde yaklaşık ${human(per) || '1 dk'}`; } };
        input.onchange = paint;
        paint();
        card.querySelector('#planSave').onclick = () => {
          const today = dayKey(), L = listened(b);
          state.plans[b.key] = { start: today, end: addDays(today, days - 1), base: L, snap: { day: today, listened: L }, at: Date.now() };
          saveNow(); closePop();
          toast(`Plan başladı: günde yaklaşık ${human(atSpeed(rem / days)) || '1 dk'}`);
          route();
        };
      }
    });
  }

  // ---------- Dinleyiş ekranları ----------
  const dateMs = ms => { const d = new Date(ms); return d.toLocaleDateString('tr', { day: 'numeric', month: 'long', ...(d.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) }); };
  const roundAcc = b => b.key === TEFSIR_KEY ? 'hatmi' : 'dinleyişi';
  const finishedText = (b, n) => b.key === TEFSIR_KEY ? `${n} hatim tamamladın` : `Bu kitabı ${n} kez bitirdin`;
  // "1. dinleyiş · 3 Mart – 28 Nisan · 56 günde · 22 sa · ort. 1,25× · planında bitti"
  function roundFacts(b, h) {
    const a = dateMs(h.start), z = dateMs(h.end);
    const days = dayDiff(dayKey(new Date(h.start)), dayKey(new Date(h.end))) + 1;
    const f = [a === z ? a : `${a} – ${z}`, `${days} günde`];
    const sec = histSec(h);
    if (sec > 60) f.push(human(sec));
    const v = sec > 600 && b.total ? b.total / sec : 0; // içerik süresi / gerçek süre
    if (v >= 0.5 && v <= 3.5) f.push(`ort. ${fmtSpeed(Math.round(v * 20) / 20)}`);
    if (h.plan) f.push(h.plan.late ? `plandan ${h.plan.late} gün geç` : 'planında bitti');
    if (h.manual) f.push('bitmiş sayıldı');
    return f;
  }
  function celebrate(b, res) {
    const n = res.n;
    openPop(`<div class="pop-h"><h4>Tebrikler!</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <p class="note" style="margin:0 0 8px">${b.key === TEFSIR_KEY ? `<b>${esc(b.title)}</b>: ${n}. hatim tamamlandı.` : `<b>${esc(b.title)}</b> kitabını ${n === 1 ? 'bitirdin' : `${n}. kez bitirdin`}.`}</p>
      <p class="note" style="margin:0">${roundFacts(b, res.h).map(esc).join(' · ')}</p>
      <div class="btn-grid"><button class="btn2" type="button" data-close>Tamam</button><button class="btn2 primary" type="button" data-goto="#kitap-${b.id}">Geçmişi gör</button></div>`, { dark: false });
    if (viewBook === b.id) renderDetail();
  }
  function askNewRound(b, ti, startAt) {
    const n = finishCount(b) + 1;
    openPop(`<div class="pop-h"><h4>${esc(b.title)}</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <p class="note" style="margin:0">${finishedText(b, n - 1)}. Yeniden mi başlıyorsun, yoksa yalnızca bu bölümü mü dinleyeceksin?</p>
      <div class="btn-grid"><button class="btn2" type="button" id="rBrowse">Sadece bu bölümü dinle</button><button class="btn2 primary" type="button" id="rNew">${n}. ${roundAcc(b)} başlat</button></div>`, {
      dark: false,
      onMount(card) {
        card.querySelector('#rBrowse').onclick = () => { closePop(); justBrowsing.add(b.key); play(b.id, ti, startAt, false); };
        card.querySelector('#rNew').onclick = () => { closePop(); startRound(b); toast(`${n}. ${roundWord(b)} başladı`); play(b.id, ti, 0, false); route(); };
      }
    });
  }
  function renderRounds(b) {
    const host = $('dRounds');
    if (!countsRounds(b)) { host.innerHTML = ''; return; }
    const past = pastRounds(b), fin = isFinished(b), pct = bookPct(b);
    const canMark = !fin && pct >= 90 && !b.tracks.every(t => prog(t)?.done);
    let html = '';
    if (fin) html += `<div class="round-h"><strong>${finishedText(b, past.length)}</strong></div>
      <button class="btn-plan" type="button" id="roundNew"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>${past.length + 1}. ${roundAcc(b)} başlat</button>`;
    else if (past.length) html += `<div class="round-h"><strong>${roundNo(b)}. ${roundWord(b)}</strong><span>%${Math.floor(pct)}</span></div><div class="gbar"><i style="width:${pct.toFixed(1)}%"></i></div>`;
    if (canMark) html += `<button class="round-mark" type="button" id="roundMark">Bitirdim say<small>Birkaç bölüm atlandıysa bu ${roundAcc(b)} bitmiş say.</small></button>`;
    if (past.length) html += `<details class="round-hist"${fin ? ' open' : ''}><summary>Geçmiş ${b.key === TEFSIR_KEY ? 'hatimler' : 'dinleyişler'} (${past.length})</summary>
      <ol>${past.slice().reverse().map(h => `<li><b>${h.n}. ${roundWord(b)}</b><span>${roundFacts(b, h).map(esc).join(' · ')}</span></li>`).join('')}</ol></details>`;
    host.innerHTML = html ? `<div class="round-card">${html}</div>` : '';
    host.querySelector('#roundNew')?.addEventListener('click', () => askNewRound(b, 0));
    host.querySelector('#roundMark')?.addEventListener('click', () => confirmPop('Bitirdim say', `<b>${esc(b.title)}</b> için bu ${roundAcc(b)} bitmiş sayılacak. Dinlenmemiş bölümler işaretlenmez; istersen yine dinleyebilirsin.`, 'Bitmiş say', () => {
      const res = closeRound(b, true); saveNow(); renderDetail(); setTimeout(() => celebrate(b, res), 50);
    }));
  }

  // ---------- Kitap detayı ----------
  function renderDetail() {
    const b = books[viewBook]; if (!b) return;
    $('detail').style.setProperty('--tint', b.tint || '#888');
    $('dCover').src = b.cover || '';
    $('dTitle').textContent = b.title;
    $('dSub').textContent = b.sub; $('dSub').hidden = !b.sub;
    const d = doneCount(b);
    const parts = [`${b.tracks.length} bölüm`];
    if (b.total) parts.push(human(b.total));
    if (d) parts.push(`${d} dinlendi`);
    $('dMeta').innerHTML = parts.map(esc).join('<span class="dot"></span>');
    $('dCount').textContent = `${b.tracks.length} bölüm`;
    const r = lastInBook(b.id);
    $('dPlay').querySelector('span').textContent = r != null ? `Devam et · Bölüm ${b.tracks[r].no}` : 'Dinlemeye başla';
    renderRounds(b);
    renderPlanCard(b);
    renderList();
  }

  function trackStatus(t) {
    const p = prog(t), dur = t.dur || p?.dur || 0;
    const pct = p && !p.done && dur ? Math.min(100, p.pos / dur * 100) : 0;
    return { p, dur, pct, text: p?.done ? 'Dinlendi' : pct > 1 ? `${human(Math.max(0, dur - p.pos))} kaldı` : human(dur) };
  }

  // Bölüm satırı: kitap sayfası ve Sesli Yayınlar aynı satırı kullanır
  function trackRow(b, t, j) {
    const { p, pct, text } = trackStatus(t);
    const isCur = cur && cur.b === b.id && cur.t === j;
    const li = document.createElement('li');
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'row' + (p?.done ? ' done' : '') + (isCur ? ' current' : '');
    const icon = p?.done && !isCur ? ICON_CHECK : isCur && !audio.paused ? ICON_PAUSE : ICON_PLAY;
    row.innerHTML = `<span class="no">${t.no}</span>
      <span class="nm"><span>${esc(t.name)}</span><small class="st-mobile">${text}</small>${pct > 1 ? `<div class="pbar"><i style="width:${pct.toFixed(1)}%"></i></div>` : ''}</span>
      <span class="dur">${text}</span>
      <span class="go"><svg viewBox="0 0 24 24">${icon}</svg></span>`;
    row.onclick = () => (isCur ? toggle() : play(b.id, j));
    li.appendChild(row);
    return li;
  }

  function renderList() {
    const b = books[viewBook]; if (!b) return;
    const q = $('search').value.trim().toLocaleLowerCase('tr');
    const list = $('list'); list.innerHTML = '';
    const frag = document.createDocumentFragment();
    b.tracks.forEach((t, j) => {
      if (q && !t.name.toLocaleLowerCase('tr').includes(q) && !t.no.includes(q)) return;
      frag.appendChild(trackRow(b, t, j));
    });
    list.appendChild(frag);
    if (!list.children.length) list.innerHTML = '<li class="empty">Bu aramayla eşleşen konu başlığı yok.</li>';
  }

  // ---------- Yönlendirme (telefonun geri tuşu için) ----------
  let sheetPushed = false, navigated = false;
  function go(hash) { if (location.hash !== hash) location.hash = hash; else route(); }
  function route(opts = {}) {
    if (!opts.keepPop) closePop(); // hesaptan gelen güncelleme açık pencereyi kapatmaz
    const h = location.hash;
    // Paylaşılan link: #dinle/<kitap klasörü>/<dosya>/<saniye> → o bölüm o saniyeden hazır bekler
    const sh = h.match(/^#dinle\/([^/]+)\/([^/]+?)(?:\/(\d+))?$/);
    if (sh) {
      const r = byKey.get(`${decodeURIComponent(sh[1])}|${decodeURIComponent(sh[2])}`);
      if (r) {
        shared = { ...r, pos: +(sh[3] || 0) };
        if (cur) { play(r.b, r.t, shared.pos); shared = null; } else showNow(r, shared.pos);
        toast(shared ? `Paylaşılan bölüm hazır · başlangıç ${fmt(shared.pos)}` : 'Paylaşılan bölüm açıldı');
        history.replaceState(null, '', location.pathname + location.search + '#calar');
        return route();
      }
      history.replaceState(null, '', location.pathname + location.search);
      return route();
    }
    const sheetOpen = h === '#calar';
    $('sheet').classList.toggle('open', sheetOpen);
    document.documentElement.style.overflow = sheetOpen ? 'hidden' : '';
    if (sheetOpen) return;
    sheetPushed = false;
    const m = h.match(/^#kitap-(\d+)$/);
    const show = id => ['home', 'detail', 'stats', 'data'].forEach(s => $(s).hidden = s !== id);
    let nav = 'home';
    if (m && books[+m[1]]) {
      if (viewBook !== +m[1]) { $('search').value = ''; window.scrollTo(0, 0); }
      viewBook = +m[1]; show('detail'); renderDetail(); nav = '';
    } else if (h === '#verilerim') {
      viewBook = null; show('data'); renderData(); nav = 'data'; window.scrollTo(0, 0);
    } else if (h === '#istatistik') {
      viewBook = null; show('stats'); renderStats(); nav = 'stats'; window.scrollTo(0, 0);
    } else {
      homeTab = h === '#sesli' && seriesBooks.length ? 'audio' : 'books';
      if (homeTab !== 'books') nav = homeTab;
      viewBook = null; show('home'); renderHome();
    }
    $$('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === nav));
    renderSide();
  }
  window.addEventListener('hashchange', () => { navigated = true; route(); });
  const openSheet = () => { if (location.hash === '#calar') return; sheetPushed = true; go('#calar'); };
  const closeSheet = () => { if (sheetPushed) history.back(); else go(''); };
  // Uygulama içinde gezinildiyse geri tuşu tarayıcı geçmişini kullanır; sayfa doğrudan bir kitap linkiyle açıldıysa ana sayfaya döner
  $$('[data-back]').forEach(b => b.onclick = () => (navigated ? history.back() : go('')));

  // ---------- Çalma ----------
  // Bitmiş kitapta bir bölüm açılınca: yeni dinleyiş mi, yoksa yalnızca göz atma mı? (oturum başına bir kez sorulur)
  const justBrowsing = new Set();
  function play(bi, ti, startAt, ask = true) {
    const b = books[bi], t = b?.tracks[ti]; if (!t) return;
    if (ask && isFinished(b) && !justBrowsing.has(b.key) && !(cur && cur.b === bi)) return askNewRound(b, ti, startAt);
    cur = { b: bi, t: ti };
    state.last = t.key;
    state.lastByBook[b.key] = t.key;
    state.recent = [b.key, ...state.recent.filter(k => k !== b.key)].slice(0, 6);
    persist(true);
    $('err').hidden = true;
    audio.src = t.url;
    const p = prog(t);
    const pos = startAt ?? (p && !p.done ? p.pos : 0);
    audio.addEventListener('loadedmetadata', () => { if (pos > 0) audio.currentTime = pos; audio.playbackRate = speed; }, { once: true });
    audio.playbackRate = speed;
    audio.volume = vol;
    audio.play().catch(() => {});
    showNow();
    if (viewBook === bi) renderDetail();
    renderSide();
  }

  function showNow(track, posOverride) {
    const c = track || cur; if (!c) return;
    const b = books[c.b], t = b.tracks[c.t];
    $('bar').hidden = false; document.body.classList.add('has-mini');
    [$('bar'), $('sheet')].forEach(el => el.style.setProperty('--tint', b.tint || '#888'));
    $('barImg').src = $('artImg').src = b.cover || '';
    $('barTrack').textContent = t.name; $('barBook').textContent = `${b.title} · Bölüm ${t.no}`;
    $('sheetBook').textContent = b.title;
    $('nowEyebrow').textContent = `Bölüm ${t.no} / ${b.tracks.length}`;
    $('nowTrack').textContent = t.name;
    $('nowBook').textContent = window.matchMedia('(min-width: 1024px)').matches ? b.title : `Bölüm ${t.no} / ${b.tracks.length}`;
    $$('[data-act="prev"]').forEach(x => x.disabled = c.t === 0);
    $$('[data-act="next"]').forEach(x => x.disabled = c.t >= b.tracks.length - 1);
    if (!cur || track) { // henüz çalmıyor: kayıtlı konumu göster
      const p = prog(t), d = t.dur || p?.dur || 0;
      const pos = posOverride ?? p?.pos ?? 0;
      $$('.seekbar').forEach(s => { s.max = Math.floor(d); s.value = Math.floor(pos); });
      paintTime(pos, d);
    }
    document.title = cur ? `${t.name} · ${b.title}` : 'Sesli Kitap Rafı';
    if ('mediaSession' in navigator && cur) {
      const art = b.cover ? [{ src: new URL(b.cover, location.href).href, sizes: '420x512', type: 'image/webp' }] : [];
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: b.title, album: 'Sesli Kitap Rafı', artwork: art });
    }
  }

  // Henüz çalmaya başlanmadıysa: paylaşılan link ile açılan bölüm, yoksa son dinlenen bölüm
  let shared = null; // {b, t, pos}
  const pending = () => { if (shared) return shared; const r = state.last && byKey.get(state.last); return r && books[r.b] ? r : null; };
  const pendingPos = l => l === shared ? shared.pos : (prog(books[l.b].tracks[l.t])?.pos || 0);
  const startPending = (l, pos) => { shared = null; play(l.b, l.t, pos); };
  const next = () => { if (cur && cur.t + 1 < books[cur.b].tracks.length) { play(cur.b, cur.t + 1, 0); return true; } return false; };
  const prev = () => { if (!cur) return; if (audio.currentTime > 5) audio.currentTime = 0; else if (cur.t > 0) play(cur.b, cur.t - 1, 0); };
  const toggle = () => {
    if (!cur) { const l = pending(); return l ? startPending(l, l === shared ? shared.pos : undefined) : play(viewBook ?? 0, 0); }
    audio.paused ? audio.play().catch(() => {}) : audio.pause();
  };
  const skip = s => {
    if (!cur) { const l = pending(); if (!l) return; return startPending(l, Math.max(0, pendingPos(l) + s)); }
    audio.currentTime = Math.max(0, Math.min((audio.duration || 0) - 0.5, audio.currentTime + s)); updateTime();
  };

  function setSpeed(v, save = true) {
    speed = Math.min(3, Math.max(0.5, Math.round(v * 20) / 20));
    audio.playbackRate = speed;
    if (save && state.speed !== speed) { state.speed = speed; persist(true); }
    $$('[data-lbl="speed"]').forEach(x => x.textContent = fmtSpeed(speed));
    $$('[data-act="speed"]').forEach(x => x.classList.toggle('on', speed !== 1));
    const out = document.querySelector('#speedOut'); if (out) out.textContent = fmtSpeed(speed);
    const sl = document.querySelector('#speedRange'); if (sl) { sl.value = speed; sl.style.setProperty('--p', ((speed - 0.5) / 2.5 * 100) + '%'); }
    $$('.chip[data-v]').forEach(c => c.setAttribute('aria-pressed', +c.dataset.v === speed));
    updateTime();
  }

  function saveProgress(done) {
    if (!cur) return;
    const t = books[cur.b].tracks[cur.t];
    const old = prog(t);
    state.progress[t.key] = { pos: done ? 0 : Math.floor(audio.currentTime * 10) / 10, dur: Math.round(audio.duration || old?.dur || t.dur || 0), done: done || old?.done || false, at: Date.now() };
    persist(false);
  }

  let seeking = null, lastSave = 0; // seeking: sürüklenen konum çubuğu
  function paintTime(c, d) {
    $$('.seekbar').forEach(s => { if (s !== seeking) s.value = Math.floor(c); s.style.setProperty('--p', d ? (c / d * 100) + '%' : '0%'); });
    $$('[data-time="cur"]').forEach(x => x.textContent = fmt(c));
    $$('[data-time="left"]').forEach(x => x.textContent = '-' + fmt((d - c) / (speed || 1)));
    $('barLine').style.width = d ? (c / d * 100) + '%' : '0';
  }
  function updateTime() {
    if (!cur) return;
    const d = audio.duration || 0, c = seeking ? +seeking.value : (audio.currentTime || 0);
    paintTime(c, d);
  }
  // Gerçekten dinlenen süreyi say (saat başına; hızlı dinleyince de gerçek süre)
  // Telefonda ekran kilitliyken tarayıcı bu olayı seyrek gönderebilir (ya da sayfayı bir süre dondurur).
  // Öyle aralıklarda süre, bölümde ilerlenen yerden hesaplanır: ilerleme ÷ hız (geçen gerçek süreyi aşmadan).
  let lastTick = 0, lastPos = 0;
  audio.addEventListener('timeupdate', () => {
    updateTime();
    const now = performance.now(), pos = audio.currentTime || 0;
    if (!audio.paused && lastTick) {
      const gap = (now - lastTick) / 1000;
      if (gap < 3) addListen(gap);
      else { const moved = (pos - lastPos) / (audio.playbackRate || 1); if (moved > 0) addListen(Math.min(moved, gap)); }
    }
    lastTick = audio.paused ? 0 : now; lastPos = pos;
    if (Date.now() - lastSave > 5000) {
      lastSave = Date.now(); saveProgress(false); reminderSync();
      // Açık kitap sayfasındaki plan kartı dinlerken de güncellensin ("bugün", hedef, geride/önde)
      if (cur && viewBook === cur.b && !$('detail').hidden) renderPlanCard(books[cur.b]);
    }
  });
  audio.addEventListener('seeking', () => { lastTick = 0; });
  audio.addEventListener('durationchange', () => { $$('.seekbar').forEach(s => s.max = Math.floor(audio.duration || 0)); updateTime(); });
  audio.addEventListener('play', () => setPlayIcon(true));
  audio.addEventListener('pause', () => { setPlayIcon(false); saveProgress(false); window.skrSync?.flush(); });
  audio.addEventListener('ended', () => {
    saveProgress(true);
    if (cur) checkRounds(books[cur.b]);
    if (sleep === 'end') { setSleep(0); toast('Uyku zamanlayıcısı: bölüm bitti'); if (viewBook != null) renderDetail(); return; }
    if (!next() && viewBook != null) renderDetail();
  });
  audio.addEventListener('error', () => {
    if (!audio.src) return;
    $('err').hidden = false; $('err').textContent = 'Ses dosyası açılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.';
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveProgress(false); window.skrSync?.flush(); } });

  function setPlayIcon(on) {
    $$('.pi').forEach(s => s.innerHTML = on ? ICON_PAUSE : ICON_PLAY);
    $$('[data-act="play"]').forEach(x => x.setAttribute('aria-label', on ? 'Duraklat' : 'Çal'));
    if (viewBook != null && cur?.b === viewBook) { renderList(); renderPlanCard(books[viewBook]); }
    if (homeTab === 'audio' && !$('home').hidden) renderAudio();
  }

  $$('.seekbar').forEach(s => {
    s.addEventListener('input', () => { if (!cur) return; seeking = s; updateTime(); });
    s.addEventListener('change', () => {
      if (!cur) { const l = pending(); if (l) startPending(l, +s.value); return; }
      audio.currentTime = +s.value; seeking = null; updateTime();
    });
  });

  // ---------- Ses düzeyi (cihaza özel, hesapla eşitlenmez) ----------
  let vol = 1;
  try { const v = parseFloat(localStorage.getItem('skr:vol')); if (v >= 0 && v <= 1) vol = v; } catch {}
  try { audio.muted = localStorage.getItem('skr:mute') === '1'; } catch {}
  function paintVol() {
    const on = !audio.muted && vol > 0, r = $('vol');
    r.value = vol; r.style.setProperty('--p', (audio.muted ? 0 : vol * 100) + '%');
    $('volOut').textContent = audio.muted ? '0' : Math.round(vol * 100);
    $('volRow').classList.toggle('off', !on);
    $('muteBtn').setAttribute('aria-label', on ? 'Sesi kapat' : 'Sesi aç');
  }
  function setVol(v) {
    vol = Math.min(1, Math.max(0, Math.round(v * 100) / 100));
    if (!sleepTick || sleepEnd - Date.now() >= 8000) audio.volume = vol;
    if (vol > 0) audio.muted = false;
    try { localStorage.setItem('skr:vol', vol); localStorage.setItem('skr:mute', audio.muted ? '1' : '0'); } catch {}
    paintVol();
  }
  $('vol').oninput = e => setVol(+e.target.value);
  $('muteBtn').onclick = () => {
    if (!audio.muted && vol === 0) return setVol(1);
    audio.muted = !audio.muted;
    try { localStorage.setItem('skr:mute', audio.muted ? '1' : '0'); } catch {}
    paintVol();
  };
  // iPhone/iPad'de ses düzeyi yalnızca cihaz tuşlarıyla değişir; orada kaydırıcı gizlenir
  { const t = new Audio(); t.volume = 0.5; if (t.volume !== 0.5) $('volRow').hidden = true; }
  audio.volume = vol; paintVol();

  // ---------- Uyku zamanlayıcısı ----------
  let sleep = 0, sleepEnd = 0, sleepTick = null;
  function setSleep(v) {
    sleep = v; clearInterval(sleepTick); audio.volume = vol;
    if (typeof v === 'number' && v > 0) {
      sleepEnd = Date.now() + v * 60000;
      sleepTick = setInterval(() => {
        const left = sleepEnd - Date.now();
        if (left <= 0) { audio.pause(); audio.volume = vol; setSleep(0); toast('Uyku zamanlayıcısı: duraklatıldı'); return; }
        if (left < 8000) audio.volume = vol * Math.max(0.05, left / 8000); // son saniyelerde sesi kıs
        paintSleep();
      }, 1000);
    }
    paintSleep();
  }
  function paintSleep() {
    const on = sleep !== 0;
    $$('[data-act="sleep"]').forEach(x => x.classList.toggle('on', on));
    const text = !on ? 'Uyku' : sleep === 'end' ? 'Bölüm sonu' : (() => { const s = Math.max(0, Math.ceil((sleepEnd - Date.now()) / 1000)); return s >= 60 ? `${Math.ceil(s / 60)} dk` : `${s} sn`; })();
    $$('[data-lbl="sleep"]').forEach(x => x.textContent = text);
    $$('.bar-tools [data-act="sleep"]').forEach(x => x.title = on ? `Uyku: ${text}` : 'Uyku zamanlayıcısı');
  }

  // ---------- Yer imleri ----------
  function addBookmark() {
    const c = cur || pending(); if (!c) return;
    const t = books[c.b].tracks[c.t];
    const pos = cur ? audio.currentTime : pendingPos(c);
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    // r: yer iminin alındığı dinleyiş (tekrar dinlenen kitaplarda gösterilir)
    state.bookmarks[id] = { k: t.key, pos: Math.floor(pos), at: Date.now(), r: countsRounds(books[c.b]) ? roundNo(books[c.b]) : undefined };
    persist(false);
    editNote(id, true);
  }
  // Yer imine not: eklerken hemen sorulur, sonra bölümler panelinden düzenlenebilir
  function editNote(id, isNew, back) {
    const m = state.bookmarks[id]; if (!m) return;
    const at = byKey.get(m.k), t = books[at.b].tracks[at.t];
    openPop(`<div class="pop-h"><h4>${isNew ? 'Yer imi eklendi' : 'Yer imi notu'}</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <p class="note" style="margin:0 0 12px">${esc(t.name)} · Bölüm ${t.no} · ${fmt(m.pos)}</p>
      <form id="noteForm"><input class="note-in" id="noteIn" maxlength="120" placeholder="Not ekle (ör. abdest bahsi)" value="${esc(m.note || '')}" autocomplete="off">
      <div class="btn-grid"><button class="btn2" type="button" id="noteSkip">${isNew ? 'Notsuz kaydet' : 'Vazgeç'}</button><button class="btn2 primary" type="submit">Kaydet</button></div></form>`, {
      onMount(card) {
        const input = card.querySelector('#noteIn');
        setTimeout(() => input.focus(), 50);
        const done = () => { closePop(); if (back) back(); };
        card.querySelector('#noteSkip').onclick = () => { if (isNew) toast(`Yer imi eklendi · ${fmt(m.pos)}`); done(); };
        card.querySelector('#noteForm').onsubmit = e => {
          e.preventDefault();
          const note = input.value.trim();
          state.bookmarks[id] = { ...m, note: note || undefined, at: Date.now() };
          persist(false);
          toast(note ? 'Not kaydedildi' : `Yer imi eklendi · ${fmt(m.pos)}`);
          done();
        };
      }
    });
  }

  // ---------- Paylaş: bölümü belirli bir saniyeden ----------
  function shareLink(t, sec) {
    const [book, file] = t.key.split('|').map(encodeURIComponent);
    return `${location.origin}${location.pathname}#dinle/${book}/${file}${sec > 0 ? '/' + Math.floor(sec) : ''}`;
  }
  const parseTime = s => { const p = String(s).trim().split(':').map(Number); if (p.some(isNaN)) return null; return p.reduce((n, x) => n * 60 + x, 0); };
  function openShare() {
    const c = cur || pending(); if (!c) return;
    const b = books[c.b], t = b.tracks[c.t];
    const pos = Math.floor(cur ? audio.currentTime : pendingPos(c));
    openPop(`<div class="pop-h"><h4>Bölümü paylaş</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <p class="note" style="margin:0">${esc(t.name)} · ${esc(b.title)}</p>
      <label class="chk"><input type="checkbox" id="shAt" ${pos > 5 ? 'checked' : ''}> Şu andan başlat: <input type="text" id="shTime" value="${fmt(pos)}" inputmode="numeric" aria-label="Başlangıç zamanı"></label>
      <div class="share-link" id="shLink"></div>
      <div class="btn-grid">
        <a class="btn2" id="shWa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-3.3-.8-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>WhatsApp</a>
        <button class="btn2" type="button" id="shCopy"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11z"/></svg>Linki kopyala</button>
        ${navigator.share ? '<button class="btn2 primary" type="button" id="shNative"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>Paylaş…</button>' : ''}
      </div>`, {
      onMount(card) {
        const at = card.querySelector('#shAt'), time = card.querySelector('#shTime');
        const sec = () => at.checked ? (parseTime(time.value) ?? pos) : 0;
        const text = () => `“${t.name}” — ${b.title}${sec() ? ` (başlangıç: ${fmt(sec())})` : ''}`;
        const upd = () => {
          const url = shareLink(t, sec());
          card.querySelector('#shLink').textContent = url;
          card.querySelector('#shWa').href = 'https://wa.me/?text=' + encodeURIComponent(`${text()}\n${url}`);
        };
        at.onchange = upd; time.oninput = () => { at.checked = true; upd(); };
        upd();
        card.querySelector('#shCopy').onclick = async () => {
          const url = shareLink(t, sec());
          try { await navigator.clipboard.writeText(url); toast('Link kopyalandı'); }
          catch { const r = document.createRange(); r.selectNodeContents(card.querySelector('#shLink')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Linki seçtim; kopyalamak için Ctrl+C'); }
        };
        card.querySelector('#shNative')?.addEventListener('click', () => {
          navigator.share({ title: t.name, text: text(), url: shareLink(t, sec()) }).catch(() => {});
        });
      }
    });
  }
  const bookmarksOf = b => Object.entries(state.bookmarks)
    .filter(([, m]) => !m.deleted && byKey.get(m.k)?.b === b)
    .map(([id, m]) => ({ id, ...m, ...byKey.get(m.k) }))
    .sort((x, y) => x.t - y.t || x.pos - y.pos);

  // ---------- Paneller ----------
  function closePop() { $('popHost').innerHTML = ''; }
  function openPop(html, { dark = true, onMount } = {}) {
    const host = $('popHost');
    host.innerHTML = `<div class="pop ${dark ? 'dark' : 'light'}"><div class="pop-bg"></div><div class="pop-card" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
    host.querySelector('.pop-bg').onclick = closePop;
    host.querySelectorAll('[data-close]').forEach(b => b.onclick = closePop);
    host.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { closePop(); go(b.dataset.goto); });
    onMount?.(host.querySelector('.pop-card'));
  }

  function openSpeed() {
    openPop(`<div class="pop-h"><h4>Oynatma hızı</h4><output id="speedOut"></output></div>
      <div class="speed-ctrl"><button type="button" id="slower" aria-label="Yavaşlat">−</button>
      <input type="range" id="speedRange" min="0.5" max="3" step="0.05" aria-label="Oynatma hızı">
      <button type="button" id="faster" aria-label="Hızlandır">+</button></div>
      <div class="chips">${SPEED_PRESETS.map(v => `<button class="chip" type="button" data-v="${v}">${fmtSpeed(v)}</button>`).join('')}</div>
      <p class="note">0,5× ile 3× arasında 0,05'lik adımlarla ayarlanır. Seçtiğin hız hatırlanır.</p>`, {
      onMount(card) {
        card.querySelector('#speedRange').oninput = e => setSpeed(+e.target.value);
        card.querySelector('#slower').onclick = () => setSpeed(speed - 0.25);
        card.querySelector('#faster').onclick = () => setSpeed(speed + 0.25);
        card.querySelectorAll('.chip').forEach(c => c.onclick = () => setSpeed(+c.dataset.v));
        setSpeed(speed, false);
      }
    });
  }

  function openSleep() {
    openPop(`<div class="pop-h"><h4>Uyku zamanlayıcısı</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <div class="opts">${SLEEP_OPTS.map(([v, l]) => `<button class="opt" type="button" data-v="${v}" aria-pressed="${String(v) === String(sleep)}">${l}<svg viewBox="0 0 24 24">${ICON_CHECK}</svg></button>`).join('')}</div>`, {
      onMount(card) {
        card.querySelectorAll('.opt').forEach(o => o.onclick = () => {
          const v = o.dataset.v === 'end' ? 'end' : +o.dataset.v;
          setSleep(v); closePop();
          if (v) toast(v === 'end' ? 'Bölüm bitince duracak' : `${v} dakika sonra duracak`);
        });
      }
    });
  }

  function openChapters(tab = 'list') {
    const c = cur || pending(); if (!c) return;
    const b = books[c.b];
    openPop(`<div class="pop-h"><h4>${esc(b.title)}</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="list">Bölümler</button><button type="button" role="tab" data-tab="marks">Yer imleri</button></div>
      <div id="tabBody"></div>`, {
      onMount(card) {
        const body = card.querySelector('#tabBody');
        const show = which => {
          card.querySelectorAll('[data-tab]').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === which));
          if (which === 'list') {
            body.innerHTML = `<ol class="plist">${b.tracks.map((t, j) => {
              const { p, text } = trackStatus(t);
              const isCur = c.b === b.id && c.t === j;
              return `<li><button type="button" class="prow${isCur ? ' current' : ''}${p?.done ? ' done' : ''}" data-j="${j}"><span class="no">${t.no}</span><span class="nm">${esc(t.name)}<small>${text}</small></span></button></li>`;
            }).join('')}</ol>`;
            body.querySelectorAll('.prow').forEach(r => r.onclick = () => { closePop(); play(b.id, +r.dataset.j); });
            body.querySelector('.prow.current')?.scrollIntoView({ block: 'center' });
          } else {
            const marks = bookmarksOf(b.id);
            body.innerHTML = marks.length ? `<div>${marks.map(m => `<div class="bm"><button type="button" class="prow" data-id="${m.id}"><span class="no">${b.tracks[m.t].no}</span><span class="nm">${m.note ? `<em>${esc(m.note)}</em>` : ''}${esc(b.tracks[m.t].name)}<small>${fmt(m.pos)} · ${new Date(m.at).toLocaleDateString('tr')}${m.r && (m.r > 1 || finishCount(b)) ? ` · ${m.r}. ${roundWord(b)}` : ''}</small></span></button><button class="del" type="button" data-note="${m.id}" aria-label="Notu düzenle"><svg viewBox="0 0 24 24"><path d="M3 17.2V21h3.8l11-11-3.8-3.8zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8z"/></svg></button><button class="del" type="button" data-del="${m.id}" aria-label="Yer imini sil">${ICON_X}</button></div>`).join('')}</div>`
              : '<p class="note">Henüz yer imi yok. Dinlerken yer imi düğmesine basınca o anki konum buraya kaydedilir.</p>';
            body.querySelectorAll('[data-id]').forEach(r => r.onclick = () => { const m = state.bookmarks[r.dataset.id]; const at = byKey.get(m.k); closePop(); if (cur && cur.b === at.b && cur.t === at.t) { audio.currentTime = m.pos; audio.play().catch(() => {}); } else play(at.b, at.t, m.pos); });
            body.querySelectorAll('[data-del]').forEach(d => d.onclick = () => { state.bookmarks[d.dataset.del] = { ...state.bookmarks[d.dataset.del], deleted: true, at: Date.now() }; persist(false); show('marks'); });
            body.querySelectorAll('[data-note]').forEach(d => d.onclick = () => editNote(d.dataset.note, false, () => openChapters('marks')));
          }
        };
        card.querySelectorAll('[data-tab]').forEach(t => t.onclick = () => show(t.dataset.tab));
        show(tab);
      }
    });
  }

  // ---------- Hesap ----------
  const GOOGLE_G = '<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3A12 12 0 1 1 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7A20 20 0 1 0 44 24c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8A12 12 0 0 1 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7A20 20 0 0 0 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A12 12 0 0 1 12.7 28l-6.5 5A20 20 0 0 0 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>';

  function avatarHTML() {
    if (user?.photoURL) return `<img alt="" src="${esc(user.photoURL)}" referrerpolicy="no-referrer">`;
    if (user) return esc((user.displayName || user.email || '?').trim().charAt(0).toLocaleUpperCase('tr'));
    return ICON_USER;
  }
  function paintAvatar() {
    $$('[data-avatar]').forEach(a => a.innerHTML = avatarHTML());
    $$('button[data-avatar]').forEach(a => a.setAttribute('aria-label', user ? 'Hesabım' : 'Giriş yap'));
    $('sideName').textContent = user ? (user.displayName || user.email) : 'Giriş yap';
    $('sideSub').textContent = user ? (user.displayName ? user.email : 'Hesabım') : 'Kaldığın yer her cihazda';
  }

  let authMode = 'in';
  function openAccount() {
    const sync = window.skrSync;
    if (!sync) {
      openPop(`<div class="pop-h"><h4>Hesap</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
        <div class="acct"><p>${window.SKR_AUTH_ERROR ? esc(window.SKR_AUTH_ERROR) : 'Giriş özelliği henüz açılmadı. Şimdilik kaldığın yer bu cihazda saklanıyor.'}</p>
        <button class="sbtn" type="button" data-goto="#verilerim">Verilerimi yönet</button></div>`, { dark: false });
      return;
    }
    if (user) {
      openPop(`<div class="pop-h"><h4>Hesabım</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
        <div class="acct"><div class="me"><span class="avatar">${avatarHTML()}</span><div style="min-width:0"><strong>${esc(user.displayName || user.email)}</strong><small>${esc(user.displayName ? user.email : '')}</small></div></div>
        <p id="syncLine">${esc(syncText)}</p>
        <button class="sbtn" type="button" data-goto="#verilerim">Verilerimi yönet</button>
        <button class="sbtn" type="button" id="signOut">Çıkış yap</button></div>`, {
        dark: false,
        onMount(card) { card.querySelector('#signOut').onclick = async () => { await sync.signOut(); closePop(); toast('Çıkış yapıldı'); }; }
      });
      return;
    }
    const isUp = authMode === 'up';
    openPop(`<div class="pop-h"><h4>${isUp ? 'Hesap oluştur' : 'Giriş yap'}</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <div class="acct">
        <p>Giriş yaptığında kaldığın yer, yer imlerin ve hız ayarın hesabına kaydedilir; telefonda bıraktığın yerden bilgisayarda devam edersin.</p>
        <button class="gbtn" type="button" id="gIn">${GOOGLE_G}Google ile devam et</button>
        <div class="or">veya e-posta ile</div>
        <form id="emailForm" novalidate>
          ${isUp ? '<div class="field"><label for="aName">Adınız soyadınız</label><input id="aName" autocomplete="name" placeholder="Adınız Soyadınız"></div>' : ''}
          <div class="field"><label for="aEmail">E-posta</label><input id="aEmail" type="email" inputmode="email" autocomplete="email" placeholder="ornek@eposta.com" required></div>
          <div class="field"><label for="aPass">Şifre</label><input id="aPass" type="password" autocomplete="${isUp ? 'new-password' : 'current-password'}" placeholder="${isUp ? 'En az 6 karakter' : 'Şifren'}" required minlength="6"></div>
          <button class="pbtn" type="submit" id="aSubmit">${isUp ? 'Hesap oluştur' : 'Giriş yap'}</button>
        </form>
        <div class="links">
          <button type="button" id="aSwitch">${isUp ? 'Zaten hesabın var mı? Giriş yap' : 'Hesabın yok mu? Kayıt ol'}</button>
          ${isUp ? '' : '<button type="button" id="aReset">Şifremi unuttum</button>'}
        </div>
        <div id="aMsg"></div>
        <button class="sbtn" type="button" data-goto="#verilerim" style="margin-top:16px">Bu cihazdaki verilerimi yönet</button>
      </div>`, {
      dark: false,
      onMount(card) {
        const msg = (text, ok) => { card.querySelector('#aMsg').innerHTML = text ? `<p class="msg ${ok ? 'ok' : 'bad'}">${esc(text)}</p>` : ''; };
        const busy = on => { card.querySelectorAll('button, input').forEach(el => el.disabled = on); };
        const run = async (fn, okText) => {
          msg(''); busy(true);
          try { await fn(); if (okText) msg(okText, true); else { closePop(); toast('Giriş yapıldı'); } }
          catch (e) { msg(sync.errorText(e)); }
          finally { busy(false); }
        };
        card.querySelector('#gIn').onclick = () => run(() => sync.signInGoogle());
        card.querySelector('#aSwitch').onclick = () => { authMode = isUp ? 'in' : 'up'; openAccount(); };
        card.querySelector('#aReset')?.addEventListener('click', () => {
          const email = card.querySelector('#aEmail').value.trim();
          if (!email) return msg('Şifre sıfırlama bağlantısı için önce e-posta adresini yaz.');
          run(() => sync.resetPassword(email), 'Şifre sıfırlama bağlantısı e-posta adresine gönderildi. Gelen kutunu (ve gereksiz klasörünü) kontrol et.');
        });
        card.querySelector('#emailForm').onsubmit = e => {
          e.preventDefault();
          const email = card.querySelector('#aEmail').value.trim(), pass = card.querySelector('#aPass').value;
          if (!email || !pass) return msg('E-posta ve şifreyi yaz.');
          if (isUp) run(() => sync.signUp(email, pass, card.querySelector('#aName').value.trim()));
          else run(() => sync.signIn(email, pass));
        };
      }
    });
  }

  // ---------- Tema: Sistem / Açık / Koyu (bu cihazda hatırlanır) ----------
  const THEMES = [
    ['system', 'Sistem', '<svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-6v2h3v2H7v-2h3v-2H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v8h14V7z"/></svg>'],
    ['light', 'Açık', '<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 2.8l2.1 2.1-1.4 1.4-2.1-2.1zm14.9 14.9 2.1 2.1-1.4 1.4-2.1-2.1zM2.8 19.8l2.1-2.1 1.4 1.4-2.1 2.1zM17.7 4.9l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>'],
    ['dark', 'Koyu', '<svg viewBox="0 0 24 24"><path d="M12.3 2a9.7 9.7 0 0 0 8.9 13.6A10 10 0 1 1 12.3 2z"/></svg>']
  ];
  let theme = store.get('theme', 'system');
  const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => theme === 'dark' || (theme === 'system' && darkMq.matches);
  function setTheme(t) {
    theme = t; store.set('theme', t);
    if (t === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    paintTheme();
  }
  function paintTheme() {
    const color = isDark() ? '#0e1211' : '#fbfbfa';
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = color);
    $('themeBtn').innerHTML = THEMES.find(x => x[0] === (isDark() ? 'dark' : 'light'))[2];
    $('themeBtn').setAttribute('aria-label', `Tema: ${THEMES.find(x => x[0] === theme)[1]}`);
    $$('[data-theme-seg]').forEach(seg => {
      seg.innerHTML = THEMES.map(([k, l, ic]) => `<button type="button" data-theme-set="${k}" aria-pressed="${k === theme}">${ic}${l}</button>`).join('');
    });
  }
  darkMq.addEventListener('change', paintTheme);
  document.addEventListener('click', e => { const b = e.target.closest('[data-theme-set]'); if (b) setTheme(b.dataset.themeSet); });
  function openTheme() {
    openPop(`<div class="pop-h"><h4>Görünüm</h4><button class="x" type="button" data-close aria-label="Kapat">${ICON_X}</button></div>
      <div class="seg big" role="group" aria-label="Tema" data-theme-seg></div>
      <p class="note">"Sistem" seçiliyken telefonunun ya da bilgisayarının açık/koyu ayarı kullanılır. Dinleme ekranı her iki temada da koyudur.</p>`, { dark: false, onMount: paintTheme });
  }

  // sync.js (Firebase) bu fonksiyonları kullanır
  let syncText = '';
  window.skrApp = {
    getState: () => state,
    setUser(u) {
      const wasIn = !!user;
      user = u; paintAvatar();
      if (!u && wasIn) { // çıkışta bu cihazdaki kişisel kaydı temizle
        audio.pause(); cur = null; state = { ...DEF(), speed }; store.set('state', state);
        $('bar').hidden = true; document.body.classList.remove('has-mini');
      }
      route();
    },
    setSyncStatus(t) { syncText = t; const el = document.querySelector('#syncLine'); if (el) el.textContent = t; },
    authReady() { window.SKR_AUTH_READY = true; if (!$('home').hidden) renderHome(); },
    // Hesaptaki kayıtla birleştir: bölüm başına yeni olan kazanır
    // quiet: yazmadan hemen önceki birleştirme; ekran yenilenmez (bir sonraki canlı güncelleme ya da gezinme yeniler)
    merge(r, { quiet = false } = {}) {
      if (!r) return;
      // Silme zamanları: hangi cihazda silinmişse, o andan eski kayıtlar her yerde atılır
      const le = state.epoch, re = { ...DEF().epoch, ...(r.epoch || {}) };
      const ep = k => Math.max(le[k] || 0, re[k] || 0);
      for (const [k, v] of Object.entries(r.progress || {})) {
        const l = state.progress[k];
        if ((v.at || 0) >= ep('progress') && (!l || (v.at || 0) > (l.at || 0))) state.progress[k] = v;
      }
      for (const [k, v] of Object.entries(r.bookmarks || {})) {
        const l = state.bookmarks[k];
        if ((v.at || 0) >= ep('bookmarks') && (!l || (v.at || 0) > (l.at || 0))) state.bookmarks[k] = v;
      }
      for (const [k, v] of Object.entries(r.plans || {})) {
        const l = state.plans[k];
        if ((v.at || 0) >= ep('plans') && (!l || (v.at || 0) > (l.at || 0))) state.plans[k] = v;
      }
      // Silinen günler: her gün için en son silme zamanı (sayaçlar bu zamana göre ayrılır)
      for (const [k, at] of Object.entries(r.dayDel || {})) if (at > (state.dayDel[k] || 0)) state.dayDel[k] = at;
      // Dinleyişler: geçmiş kayıt başına yeni olan; süren dinleyiş yeni olan tarafınki (aynı dinleyişse cihaz süreleri birleşir)
      for (const [k, v] of Object.entries(r.rounds || {})) {
        const l = (state.rounds[k] ||= { cur: null, at: 0, hist: {} });
        for (const [n, h] of Object.entries(v.hist || {})) if ((h.at || 0) >= ep('rounds') && (!l.hist[n] || (h.at || 0) > (l.hist[n].at || 0))) l.hist[n] = h;
        if ((v.at || 0) >= ep('rounds')) {
          const same = l.cur && v.cur && l.cur.n === v.cur.n;
          // Cihaz cihaz, gün gün büyük olan
          let sec = null;
          if (same) {
            const a = { sec: JSON.parse(JSON.stringify(l.cur.sec || {})) }, z = { sec: JSON.parse(JSON.stringify(v.cur.sec || {})) };
            for (const d of Object.keys(z.sec)) { const m = devSec(a, d); for (const [k, s] of Object.entries(devSec(z, d))) if (s > (m[k] || 0)) m[k] = s; }
            sec = a.sec;
          }
          if ((v.at || 0) > (l.at || 0)) { l.cur = v.cur ? { ...v.cur } : null; l.at = v.at; }
          if (same && l.cur) l.cur.sec = sec;
        }
      }
      // Dinleme süreleri: her cihazın her günü için büyük olan (sayaçlar yalnızca artar);
      // geçmiş başka cihazda silinmişse buradaki eski sayaçlar da silinir
      if ((re.daily || 0) > (le.daily || 0)) { state.daily = {}; state.dayBooks = {}; state.dayContent = {}; }
      if ((re.daily || 0) >= (le.daily || 0)) {
        for (const [dev, days] of Object.entries(r.daily || {})) {
          const l = (state.daily[dev] ||= {});
          for (const [k, s] of Object.entries(days)) if (s > (l[k] || 0)) l[k] = s;
        }
        // Gün gün kitap süreleri (gerçek ve içerik) de aynı kuralla: cihaz, gün ve kitap başına büyük olan
        for (const f of ['dayBooks', 'dayContent']) for (const [dev, days] of Object.entries(r[f] || {})) {
          const l = ((state[f] ||= {})[dev] ||= {});
          for (const [k, bs] of Object.entries(days)) { const m = (l[k] ||= {}); for (const [bk, s] of Object.entries(bs || {})) if (s > (m[bk] || 0)) m[bk] = s; }
        }
      }
      for (const k of Object.keys(re)) le[k] = ep(k);
      pruneOld();
      checkRounds(); // hesaptan gelen bölüm işaretleriyle biten kitaplar
      if ((r.updatedAt || 0) > (state.updatedAt || 0)) {
        state.last = r.last ?? null; state.lastByBook = r.lastByBook || {}; state.recent = r.recent || [];
        state.speed = r.speed || 1; state.goal = r.goal || 15; state.updatedAt = r.updatedAt;
        setSpeed(state.speed, false);
      }
      store.set('state', state);
      if (quiet) return;
      if (!cur) { const l = pending(); if (l) showNow(l); }
      if ($('sheet').classList.contains('open')) return;
      route({ keepPop: true });
    }
  };

  // ---------- Bağlantılar ----------
  const ACTIONS = { play: toggle, prev, next, speed: openSpeed, sleep: openSleep, mark: addBookmark, list: () => openChapters('list'), expand: openSheet, account: openAccount, theme: openTheme, share: openShare, install };
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a && !a.disabled && ACTIONS[a.dataset.act]) { e.preventDefault(); ACTIONS[a.dataset.act](); return; }
    const s = e.target.closest('[data-skip]');
    if (s) skip(+s.dataset.skip);
  });
  $('closeSheet').onclick = closeSheet;
  $('toBook').onclick = () => { const c = cur || pending(); go(c ? `#kitap-${c.b}` : ''); };
  $('search').addEventListener('input', renderList);
  $('dPlay').onclick = () => { const r = lastInBook(viewBook); if (isFinished(books[viewBook]) && !justBrowsing.has(books[viewBook].key)) return askNewRound(books[viewBook], 0); if (cur && cur.b === viewBook && cur.t === r) toggle(); else play(viewBook, r ?? 0); };
  window.matchMedia('(min-width: 1024px)').addEventListener('change', () => showNow(cur || pending()));

  $('gSearch').addEventListener('input', renderSearch);
  $('gSearch').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; renderSearch(); } });

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === '/' && !$('home').hidden) { e.preventDefault(); $('gSearch').focus(); return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') skip(e.shiftKey ? 60 : 15);
    else if (e.code === 'ArrowLeft') skip(e.shiftKey ? -60 : -15);
    else if (e.key === 'Escape') { if ($('popHost').innerHTML) closePop(); else if (location.hash === '#calar') closeSheet(); }
  });

  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    ms.setActionHandler('play', () => toggle());
    ms.setActionHandler('pause', () => audio.pause());
    ms.setActionHandler('nexttrack', next);
    ms.setActionHandler('previoustrack', prev);
    ms.setActionHandler('seekbackward', d => skip(-(d.seekOffset || 15)));
    ms.setActionHandler('seekforward', d => skip(d.seekOffset || 15));
  }

  setSpeed(speed, false);
  paintAvatar(); paintSleep(); paintTheme(); paintInstall();
  store.set('state', state);
  reminderStatus = reminder().on ? 'Açık' : 'Kapalı';

  // Uygulama kabuğu önbelleği ve arka plan hatırlatması (yalnızca http/https'te)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    setTimeout(checkReminderNow, 4000);
    setInterval(checkReminderNow, 10 * 60 * 1000);
  }
  checkRounds(); // eski sürümde bitirilmiş kitaplar 1 kez bitmiş sayılır
  const l = pending();
  if (l) showNow(l);
  if (location.hash === '#calar' && !l) history.replaceState(null, '', location.pathname);
  route();
})();
</script>
<!-- Hesap ve senkron (Firebase). firebase-config.js boşsa site hesapsız çalışır. -->
<script type="module" src="sync.js"></script>
